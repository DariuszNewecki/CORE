# Global exclude for archived or environment files
exclude: "^(.archive/|.venv/|venv/|build/|dist/)"

repos:
  # Basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Black formatter (manual stage only)
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        stages: [manual]
        files: \.pyi?$
        exclude: ^(scripts|dev-scripts)/

  # Ruff linter + formatter (Python files only)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        args: [--fix, --exit-zero]
        files: \.pyi?$
        exclude: ^(scripts|dev-scripts)/
      - id: ruff-format
        files: \.pyi?$
        exclude: ^(scripts|dev-scripts)/

  # Shell scripts (#911): shellcheck on every tracked *.sh. Runs the system
  # binary so the hook is offline-installable; CI runs the same check
  # (core-ci.yml static-checks) because CI does not run pre-commit.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        exclude: ^(\.archive|\.venv|venv|build|dist)/

  # Symbol ID discipline — CLAUDE.md §Symbol IDs
  - repo: local
    hooks:
      - id: check-symbol-ids
        name: check symbol IDs
        entry: python hooks/check_symbol_ids.py
        language: python
        types: [python]
        files: ^src/

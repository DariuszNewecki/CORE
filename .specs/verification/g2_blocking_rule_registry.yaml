# .specs/verification/g2_blocking_rule_registry.yaml
#
# URS-production-readiness.md G2 census + ratchet (#842 Unit A).
#
# Every rule with enforcement: "blocking" across .intent/rules/**/*.json,
# one row each, no more and no fewer. Generated from the same production
# loaders the enforcing test uses
# (shared.infrastructure.intent.rule_registry.get_rule_enforcement_map +
# mind.governance.enforcement_loader.EnforcementMappingLoader) so the
# registry and the live rule/mapping corpus cannot silently diverge --
# tests/mind/governance/test_g2_blocking_rule_registry.py enforces exact
# agreement on every CI run. See #842 for the full census methodology.
#
# Fields:
#   rule_id           - .intent/rules/**/*.json rule id
#   engine            - live .intent/enforcement/mappings/**/*.yaml engine
#   mechanism_class   - engine_mapped | passive_gate_class_a |
#                       passive_gate_class_b | advisory_mapped
#                       (advisory_mapped = mapped engine: advisory, i.e.
#                       no engine dispatch; ADR-142 attestation_class for
#                       passive_gate rows)
#   violating_fixture - test reference proving the block fires; null until
#                       depth-verified (subsequent #842 units)
#   compliant_fixture - test reference proving no false positive; null
#                       until depth-verified
#   state             - unverified | gap | decision_required | verified
#                       unverified: default, not yet assessed by this
#                       program. gap / decision_required: reserved for
#                       later units' classification pass -- not assigned
#                       here. verified: both fixture refs present and
#                       confirmed real (not a literal-ID-mention proxy).


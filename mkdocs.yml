site_name: CORE Documentation
site_description: Constitutional, self-governing AI development framework.
repo_name: DariuszNewecki/CORE
repo_url: https://github.com/DariuszNewecki/CORE

theme:
      name: material
      language: en
      features:
            - navigation.tabs # top-level items as tabs at the top
            - navigation.top # back-to-top button
            - toc.integrate # put headings inside the page, not in a sidebar

# ADR-167 D5: link and anchor validity is a tool gate. Deploy Docs builds
# with --strict, so any of these warnings fails the build.
validation:
      links:
            not_found: warn
            anchors: warn
      anchors: warn

plugins:
      - search:
              lang: en
              separator: '[\s\-\.]+'

nav:
      - Home: index.md
      - Tutorials:
              - Start a governed project: start-a-project.md
              - Audit in CI (GitHub): cold-reviewer.md
      - How-to guides:
              - Add a rule pack: adopt-a-pack.md
              - Audit with pre-commit or GitLab: other-ci.md
              - Govern your own repository: byor-quickstart.md
              - Run the full runtime: getting-started.md
              - Run a GRC gap analysis: grc-gap-analysis.md
              - Upgrade a CORE database: upgrading.md
      - Reference:
              - CLI overview: cli-reference.md
              - core-admin: reference/core-admin.md
              - core: reference/core.md
              - API contract: reference/api.md
              - Vocabulary: vocabulary.md
      - Explanation:
              - How it works: how-it-works.md
              - Autonomy ladder: autonomy-ladder.md
              - Proof index: proof-index.md
      - Project:
              - Contributing: contributing.md
              - Release process: release.md

markdown_extensions:
      - admonition
      - tables
      - footnotes
      - def_list
      - attr_list
      - pymdownx.highlight
      - pymdownx.details
      - pymdownx.tabbed:
              alternate_style: true
      - pymdownx.emoji:
              emoji_generator:
                    !!python/name:materialx.emoji.to_svg # Critical: Enables Mermaid diagram rendering for architecture docs

      - pymdownx.superfences:
              custom_fences:
                    - name: mermaid
                      class: mermaid
                      format: !!python/name:pymdownx.superfences.fence_code_format

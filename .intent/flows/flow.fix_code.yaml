$schema: "META/flow.schema.json"
kind: flow

metadata:
  id: flows.fix_code
  title: Fix Code Flow
  version: "1.0.0"
  authority: policy
  status: active

flow:
  flow_id: flow.fix_code
  description: >
    Apply all code compliance fixes in constitutional prerequisite order.
  policies:
    - rules/code/purity

  steps:
    - ref_id: fix.headers
      kind: action
      required: true

    - ref_id: fix.ids
      kind: action
      required: true

    - ref_id: fix.duplicate_ids
      kind: action
      required: true

    - ref_id: fix.imports
      kind: action
      required: true

    - ref_id: fix.logging
      kind: action
      required: true

    - ref_id: fix.placeholders
      kind: action
      required: true

    - ref_id: fix.atomic_actions
      kind: action
      required: true

    - ref_id: fix.modularity
      kind: action
      required: false

    - ref_id: fix.format
      kind: action
      required: true

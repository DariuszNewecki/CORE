$schema: "META/flow.schema.json"
kind: flow

metadata:
  id: flows.sync_state
  title: Sync State Flow
  version: "1.0.0"
  authority: policy
  status: active

flow:
  flow_id: flow.sync_state
  description: >
    Synchronise code symbols and semantic vectors to PostgreSQL and Qdrant.
  policies:
    - rules/code/purity

  steps:
    - ref_id: sync.db
      kind: action
      required: true

    - ref_id: sync.vectors_code
      kind: action
      required: true

    - ref_id: sync.vectors_constitution
      kind: action
      required: false

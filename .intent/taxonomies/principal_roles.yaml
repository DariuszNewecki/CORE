version: "1.1.0"
status: active
authority: constitutional
title: CORE Principal Role Taxonomy
description: >
  Canonical declaration of principal roles in CORE. Defines what roles
  exist and what authority each carries (Layer 1 of the three-layer role
  model). Principal-to-role binding (Layer 2) is a deployment concern.
  Action-to-role requirements (Layer 3) are expressed in enforcement rules.
  Authority: ADR-068 (D2; amendment 2026-10-11 A2, A3, A6.1).

governance:
  flat_forever: true
  rationale: >
    Role hierarchy is permanently rejected. Scope constraints are expressed
    as attributes on Layer 2 bindings, not as structural properties of roles.
    This makes permission attribution a one-sentence answer, required for
    GxP audit defensibility. See ADR-068 D1.

roles:
  principal.governor:
    display_name: Governor
    authority: constitutional
    description: >
      Full constitutional authority. May approve or reject proposals, accept
      ADRs, authorize .intent/ changes, and trigger any governed operation.
      At most one Governor per deployment at any given time.
    proposal_approval_authority: true
    read_access: full
    write_access: full

  principal.operator:
    display_name: Operator
    authority: policy
    description: >
      Read all system state; trigger read-only operations (audit runs,
      inspect, coverage). Cannot approve proposals or authorize
      constitutional changes.
    proposal_approval_authority: false
    read_access: full
    write_access: none

  principal.auditor:
    display_name: Auditor
    authority: policy
    description: >
      Read audit findings, consequence chain, and compliance evidence.
      No write access of any kind. Designed for the GxP QA archetype:
      an external auditor who inspects the trail without influencing it.
      A principal holding this role may not have approved the proposals
      they are auditing (SoD constraint -- ADR-068 D3).
    proposal_approval_authority: false
    read_access: audit_trail_only
    write_access: none

  principal.system:
    display_name: System Agent
    authority: policy
    description: >
      Autonomous system actors -- workers, daemons, and the risk classifier.
      The risk_classification.safe_auto_approval authority belongs to this
      role class. Distinct from human principals; never issued credentials.
    proposal_approval_authority: false
    read_access: operational
    write_access: operational

  principal.producer:
    display_name: Producer
    authority: policy
    description: >
      Produces changes -- code, tests, drafts of law -- and submits them as
      proposals (ADR-168). Writes only its own working tree and proposals.
      Never approves a proposal, never writes governed text, never deploys,
      never holds a production credential. AI assistants, including the
      governor's own model session, are producers. Mechanism accounts
      (core-law, core-build, core-sandbox) are not principals: each acts
      only on someone else's act. See ADR-068 amendment 2026-10-11 A3.
    proposal_approval_authority: false
    read_access: full
    write_access: own_working_tree_and_proposals

separation_of_duties:
  governor_auditor_constraint:
    description: >
      A principal holding principal.governor authority may not serve as
      principal.auditor for the same governance action. A proposal approved
      by a Governor cannot have its audit-verification record signed by the
      same principal. Enforcement deferred to first multi-operator deployment
      (Track 3). Declared here so Team/Enterprise tiers inherit no structural
      SoD gap. See ADR-068 D3.
    status: declared
    enforcement: deferred

# ADR-068 amendment 2026-10-11 A1 superseded D4's single_governor_local
# topology: "local" no longer means "the governor". The role set is the same
# in every mode; a mode decides how principals are bound (Layer 2) and so
# what CORE may honestly claim. A mode never changes silently: a deployment
# whose machine does not match its declared mode is a finding (A6.3).
operation_modes:
  solo:
    description: >
      An adopter: one OS account, human and assistant indistinguishable to
      the system. No binding. Governor acts need a human-typed confirmation
      and leave a record; CORE states plainly that the assistant could have
      made them.
    binding: none
    claim: detects_not_prevents
  solo-separated:
    description: >
      One OS account per role or mechanism (A4); the binding file of
      ADR-132 D10.2, root-owned, outside the repository. Prevents each act
      in A5 whose mechanism is live; an act whose mechanism is not live is
      reported as such.
    binding: os_accounts
    claim: prevents_where_mechanism_live
  platform:
    description: >
      Teams, through core-platform: identities and roles from the platform,
      D3's separation of duties enforced. Built on a solo-separated host,
      never instead of one.
    binding: platform_identity
    claim: prevents_and_separates_duties

# The mode this deployment declares (A6.1). The default for an adopter is
# solo. CORE's own server is solo-separated (A7); until the check (A6.3) is
# built, the declaration is not yet compared with the machine.
deployment:
  mode: solo-separated

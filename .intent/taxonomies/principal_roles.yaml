version: "3.0.0"
status: active
authority: constitutional
title: CORE Principal Role Taxonomy and Access Register
description: >
  Canonical declaration of who may do what in CORE (RBAC). A closed list of
  permissions, the roles that carry them, the identities bound to each role,
  and the rules that hold between them. Authority: ADR-068 (D1; amendment
  2026-10-11 A2, A6.1; amendment 2026-10-15, the governor's final RBAC
  proposal). The binding of OS accounts to roles that the API enforces stays
  in root-owned /etc/core/principals.yaml (ADR-132 D10.2); this register is
  what that file, the host and GitHub are checked against.

governance:
  flat_forever: true
  rationale: >
    Role hierarchy is permanently rejected. A permission is held by a role,
    never by an identity, so "who may do X" is a one-sentence answer. See
    ADR-068 D1.

# Closed list. Nothing outside it is a CORE permission.
permissions:
  approve.change: Approve a code change (a pull request, a proposal).
  approve.law: Approve a change to governed text.
  propose.change: Propose a change to code or law.
  read.law: Read governed text.
  read.state: Read CORE's state, through CORE's API.
  read.secrets: Read production credentials.
  write.law: Write governed text.
  run.services: Run CORE's daemon, workers and API.
  deploy: Make a merged commit live.
  run.untrusted: Run repository code, with no secrets and no network.

roles:
  principal.governor:
    display_name: Governor
    authority: constitutional
    permissions: [approve.change, approve.law, read.law, read.state]
    proposal_approval_authority: true
    description: >
      Approves changes and law. At most one Governor per deployment.

  principal.producer:
    display_name: Producer
    authority: policy
    permissions: [propose.change, read.law, read.state]
    proposal_approval_authority: false
    description: >
      Produces changes, code and drafts of law, and proposes them. Never
      approves.

  principal.operator:
    display_name: Operator
    authority: policy
    permissions: [run.services, read.secrets]
    proposal_approval_authority: false
    description: >
      CORE's services. The only role that reads secrets. The services'
      safe auto-approval (ADR-068 D5) applies the envelope the governor
      approved as law; it is not approve.change.

  principal.custodian:
    display_name: Custodian
    authority: policy
    permissions: [write.law]
    proposal_approval_authority: false
    description: >
      Writes governed text, and only after approve.law (ADR-170).

  principal.deployer:
    display_name: Deployer
    authority: policy
    permissions: [deploy]
    proposal_approval_authority: false
    description: >
      Makes the governor's merges live (core-deploy).

  principal.executor:
    display_name: Executor
    authority: policy
    permissions: [run.untrusted]
    proposal_approval_authority: false
    description: >
      Builds releases and runs repository code; no secrets, no network.

# Identities -> roles. OS accounts on CORE's server, GitHub accounts on the
# repository.
identities:
  os_accounts:
    core-darek: principal.governor
    core-claude: principal.producer
    core: principal.operator
    core-law: principal.custodian
    core-runner: principal.deployer
    core-build: principal.executor
    core-sandbox: principal.executor
  github_accounts:
    DariuszNewecki: principal.governor
    core-claude-bot: principal.producer

# Host administration is not a CORE role (rule 6).
host_administration:
  os_accounts: [darek, root]

# What the host grants each identity, as the roles need it. Anything not
# listed here is a finding (rule 5).
host_grants:
  groups:
    core-gov:
      members: [core-darek]
      purpose: the governor's socket, /run/core/api (ADR-132 D10.3)
    core-dev:
      members: [core, core-darek, core-claude]
      purpose: the shared development tree
  sudo_rules:
    - who: core-runner
      as: root
      command: /usr/local/sbin/core-deploy
      purpose: deploy
    - who: core-runner
      as: core
      command: /usr/local/sbin/core-sandbox-check
      purpose: deploy (probe the sandbox)

rules:
  - id: rbac.roles_only
    statement: Permissions are granted to roles only, never directly to an identity.
  - id: rbac.propose_not_approve
    statement: No identity holds both propose.change and approve.change.
  - id: rbac.secrets_operator_only
    statement: >
      Only the Operator holds read.secrets; every other role reads state
      through CORE's API.
  - id: rbac.law_written_after_approval
    statement: write.law happens only after approve.law.
  - id: rbac.register_is_complete
    statement: >
      Any account, group, sudo rule or GitHub collaborator not in the
      register is a blocking finding.
  - id: rbac.host_administration_outside
    statement: >
      Host administration is not a CORE role: darek and root perform no
      governance act and are outside CORE's trust boundary.

operation_modes:
  solo:
    description: >
      An adopter: one OS account, human and assistant indistinguishable to
      the system. No binding. Governor acts need a human-typed confirmation
      and leave a record; CORE states plainly that the assistant could have
      made them.
    binding: none
    claim: detects_not_prevents
  solo-separated:
    description: >
      One OS account per role (the identities above); the binding file of
      ADR-132 D10.2, root-owned, outside the repository. Prevents each act
      whose mechanism is live; an act whose mechanism is not live is
      reported as such.
    binding: os_accounts
    claim: prevents_where_mechanism_live
  platform:
    description: >
      Teams, through core-platform: identities and roles from the platform.
      Built on a solo-separated host, never instead of one.
    binding: platform_identity
    claim: prevents_and_separates_duties

deployment:
  mode: solo-separated

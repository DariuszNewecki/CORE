    action: fix.modularity
    confidence: 0.40
    description: >
      ADR-095 D1: modularity family is architectural-judgment, not autonomous
      remediation. Even mechanical-split candidates can be facades the filter
      cannot distinguish (proposal 3703c54a on coherence_service.py was the
      triage case). Routed to governor inbox as DELEGATE.
    status: DELEGATE

  ai.cognitive_role.no_hardcoded_string:
    action: remediate.cognitive_role
    confidence: 0.85
    description: >
      Hardcoded cognitive role string replaced with a governed constant from
      the cognitive_roles registry. LLM-assisted rewrite via CoderAgent.
      Human approval required before execution. See #133.
    status: ACTIVE

  modularity.class_too_large:
    action: fix.modularity
    confidence: 0.40
    description: >
      ADR-007 + ADR-095 D1: class-level refactors are architectural
      judgment -- non-automatable. The action: field is a placeholder
      to satisfy ADR-066's mapping invariant; DELEGATE status prevents
      autonomous remediation. Routed to governor inbox.
    status: DELEGATE

  architecture.channels.logger_not_presentation:
    action: fix.logging
    confidence: 0.40
    description: >
      Logger used for presentation output -- Rich objects or strings
      containing Rich markup passed to logger.* calls. Correct
      remediation is the inverse direction of fix.logging: convert
      logger.* back to console.print where the content carries Rich
      content. No automatable fixer exists; manual migration is the
      only safe path (precedent: #371's 8-batch hand migration of 113
      sites across src/cli/). Routed to governor inbox as DELEGATE.
      Confidence below MIN_CONFIDENCE (0.80) prevents dispatch.
      Explicitly mapped -- not unmapped -- to halt the abandoned-finding
      re-emission loop that previously occurred when the rule had no
      entry at all (peak: 1,558 abandoned findings in 48h from two
      files before #343/#344 deletion).
    status: DELEGATE

  architecture.acceptance.test_gen_must_include_sandbox_gate:
    action: fix.modularity
    confidence: 0.40
    description: >
      The test_generation CognitiveFlowDelegate's AcceptanceCondition is
      missing PytestAcceptanceCondition from its composite. Restoring the
      runtime gate requires understanding the delegate's construction site
      and ADR-140 D9's wiring -- governor decision. Non-automatable.
    status: DELEGATE


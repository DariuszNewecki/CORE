  governance.taxonomy.operational_capabilities_decorator_backing:
    action: fix.modularity
    confidence: 0.40
    description: >
      A capability id in .intent/taxonomies/operational_capabilities.yaml
      has no matching @atomic_action decoration in src/ -- a phantom that
      cannot be authorized by the ADR-079 chokepoint. Resolution is a
      governor decision: either strip the YAML entry (the capability does
      not represent a real authority), or decorate the underlying function
      with @atomic_action(action_id="<id>") and route its dispatch through
      ActionExecutor.execute so the token is actually set. Per ADR-079 D9
      Shape 1 (strip) and Shape 2 (re-route + register/decorate/**kwargs).
      The autonomous remediator cannot pick between the two paths.
    status: DELEGATE

  governance.taxonomy.sensor_supported_by_declaration:
    action: fix.modularity
    confidence: 0.40
    description: >
      ADR-091 D4: sensor<->artifact_type symmetry rule. Every sensor worker
      declared in .intent/workers/ must be listed under at least one
      artifact_type's supported_sensors, and every supported_sensors entry
      must resolve to an existing sensor worker declaration. Asymmetric
      entries surface here. Resolution is a governor decision: author the
      missing sensor worker, add the missing supported_sensors entry on the
      artifact_type, or strip the dangling reference if the linkage is
      stale. The autonomous remediator cannot pick between the three paths.
      Mirrors the cognate pattern in
      governance.taxonomy.operational_capabilities_decorator_backing
      (ADR-079 D9 Shape 1/2). Explicitly mapped to satisfy the ADR-066
      unmapped-rules invariant. Promotion path: ADR-091 D4 Phase 7 lifts
      this rule from `reporting` to `blocking` once #570 closes; mapping
      stays DELEGATE.
    status: DELEGATE

  governance.taxonomy.action_supported_by_declaration:
    action: fix.modularity
    confidence: 0.40
    description: >
      ADR-092-A (F-43): action<->artifact_type symmetry rule. Every atomic
      action declaring artifact_types in action_risk.yaml must appear in
      the artifact_type's supported_actions array, and every
      supported_actions entry must correspond to a registered action with
      a matching artifact_types declaration. Resolution is a governor
      decision: register the action in the artifact_type's
      supported_actions, remove the artifact_types declaration from
      action_risk.yaml, or strip the dangling reference. The autonomous
      remediator cannot choose between the paths. Mirrors
      governance.taxonomy.sensor_supported_by_declaration (F-42).
      Explicitly mapped to satisfy the ADR-066 unmapped-rules invariant.
      Promotion path: ADR-092-A Phase 7 lifts from reporting to blocking
      once the F-41<=>F-42<=>F-43 triad stabilizes; mapping stays DELEGATE.
    status: DELEGATE


    status: DELEGATE

  governance.passive_gate.enforced_by_must_resolve:
    action: fix.modularity
    confidence: 0.40
    description: >
      A Class A passive_gate mapping's enforced_by param does not resolve
      to an existing Python symbol in src/. Fix: update enforced_by to the
      symbol's current dotted path, or reclassify the mapping to the correct
      attestation_class if enforcement moved to a different mechanism (B/C/D).
      Non-automatable; requires governor review of the stale claim. ADR-142.
    status: DELEGATE

  governance.remediation.all_rules_mapped:
    action: fix.modularity
    confidence: 0.40
    description: >
      Meta-governance: an active reporting rule has no
      auto_remediation.yaml entry -- the invariant established by
      ADR-066 is violated. Resolution: add a DELEGATE or PENDING entry
      for the unmapped rule. Non-automatable; requires governor review
      of the rule registry.
    status: DELEGATE

  governance.namespace.classification_complete:
    action: fix.modularity
    confidence: 0.40
    description: >
      A file under .intent/ or .specs/ has no entry in
      .intent/governance/namespace_manifest.yaml -- the
      framework/project classification invariant established by
      ADR-075 D7 is violated. Classification is a property of an
      artifact's purpose, not its file type (D5), so the manifest
      entry is the governor-authored constitutional record; no
      heuristic can substitute. Resolution: governor reviews the
      unclassified file and adds a manifest entry with
      governance_namespace = framework or project::<name>.
      Non-automatable per D5; routed to governor inbox as DELEGATE.
      Explicitly mapped to satisfy the ADR-066 unmapped-rules
      invariant.
    status: DELEGATE

  governance.fs_operations.completeness:
    action: fix.modularity
    confidence: 0.40
    description: >
      The filesystem-operation taxonomy at
      .intent/taxonomies/filesystem_operations.yaml is out of
      sync with the runtime FS surface -- either a pathlib.Path
      public method exists in the interpreter but is not
      classified, a curated `watched` entry no longer resolves to
      a callable in its module (stdlib rename/removal or
      third-party absence), or the declared python_version no
      longer matches runtime sys.version_info major.minor (ADR-077
      S3 + S5). Resolution: governor reviews the surfaced gap and
      either classifies the new call (read / traverse / parse /
      write / neutral per fs_audit_op_class.enum), removes the
      stale watched entry, or refreshes the python_version
      after re-verifying classifications against the new
      interpreter. Classification is a governance decision
      (the same name can be read or write depending on call
      semantics); no heuristic can substitute. Non-automatable
      per ADR-077 S3; routed to governor inbox as DELEGATE.
      Explicitly mapped to satisfy the ADR-066 unmapped-rules
      invariant.
    status: DELEGATE

  governance.quarantine.namespace_has_drainer:
    action: fix.modularity
    confidence: 0.40
    description: >
      Meta-governance: a subject namespace has rows in awaiting_reaudit
      but no drainer is registered in
      .intent/enforcement/quarantine/drainer_registry.yaml -- the
      invariant established by ADR-072 is violated. Resolution: either
      implement a drainer worker for the namespace (mirroring
      AuditViolationSensor's release-pass and TestRunnerSensor's D5
      wiring) and register it, or determine that emission into the
      namespace should be removed. Non-automatable; requires governor
      architectural decision.
    status: DELEGATE

  coherence.repo_artifacts.drift:
    action: fix.modularity
    confidence: 0.40
    description: >
      ADR-070 D8 writer-as-sensor: orphan rows in core.repo_artifacts
      (rows whose file_path no longer exists on disk) are detected
      every RepoCrawlerWorker cycle. Two emission paths share this
      rule; the finding's `status` and `payload.drift_class`
      discriminate. (1) `status=resolved` / `drift_class=reaped_inline`:
      the drift was within the safety bounds and reaped INLINE in the
      same cycle (ADR-070 D4 writer-as-sensor + inline remediation);
      finding is audit-trail attribution only. (2) `status=open` /
      `drift_class=excessive_or_partial_walk`: a safety guard tripped
      (proposed reap above hard/fraction cap, or walker enumerated
      suspiciously few files); the reap was SKIPPED pending governor
      inspection of `payload.sample_paths`. Either way no proposal is
      dispatched -- the writer is constitutionally permitted to mutate
      the projection but only under bounded conditions, and the OPEN
      case explicitly routes to governor decision rather than
      autonomous action. This DELEGATE entry satisfies the ADR-066
      invariant that every active rule must have a remediation map
      entry.
    status: DELEGATE

  governance.commit_authorship_integrity:
    action: fix.modularity
    confidence: 0.10
    description: >
      ADR-129 D5: a contaminated autonomous commit (diff outside declared
      production set) requires governor investigation -- git history rewrite
      with proper attribution, or documented acceptance as exception. No
      autonomous remediation action exists. PENDING satisfies ADR-066
      (governance.remediation.all_rules_mapped). action: field is a
      placeholder only.
    status: PENDING

  modernization.dead_shim:
    action: fix.modularity
    confidence: 0.10
    description: >
      ADR-151 D4: dead-shim findings resolve by governed verify-then-delete
      -- a dynamic-dispatch/config re-verification precedes removal, and
      autonomous remediation is deliberately deferred until the sensor's
      false-positive rate is measured (D3). First cycles route to the
      governor / Claude Code, mirroring the #804 procedure. PENDING
      satisfies ADR-066 (governance.remediation.all_rules_mapped).
      action: field is a placeholder only.
    status: PENDING

  modularity.needs_refactor:
    action: fix.modularity
    confidence: 0.40
    description: >
      ADR-095 D1: mixed-discipline files require architectural judgment;
      no autonomous remediation. action: field is placeholder to satisfy

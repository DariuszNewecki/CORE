safe_auto_approval_envelope:
  authorized_actions:
    - fix.imports
    - fix.ids
    - fix.logging
    - fix.headers
    - fix.format
  authorized_flows:
    - flow_id: flow.build_test_for_symbol
      write_path_prefixes: [tests/]
      read_path_prefixes: [src/, tests/]
      required_steps: [test.sandbox_validate]
  authorized_path_prefixes:
    - src/
    - tests/
  authorized_extensions:
    - .py

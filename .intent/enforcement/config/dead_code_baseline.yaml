# .intent/enforcement/config/dead_code_baseline.yaml
#
# Dead-code ratchet baseline for purity.no_dead_code
# Authority: policy
# Phase: audit
# Status: active
#
# PURPOSE:
#   The dead-code candidates known on 2026-10-09, when the rule was first able
#   to see unused functions, methods and classes (proposal 0006). The check
#   does not report these; anything new is reported. Each entry is
#   "src/path.py::symbol".
#
#   Most entries are live in ways vulture cannot see (dispatch by name,
#   protocol methods, ORM classes used through SQL, test oracles, the parked
#   V2.3 scaffold, core-platform's imports) or are still to be triaged
#   (var/reports/2026-10-09-dead-code-sweep-plan.md). Removing dead code:
#   delete the symbol and its entry here in the same change. This list should
#   only shrink.


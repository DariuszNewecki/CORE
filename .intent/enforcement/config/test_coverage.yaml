source_root: "src"
test_root: "tests"
test_file_suffix: "/test_generated.py"

exempt_modules_without_public_symbols: true

excluded_filenames:
  - "__init__.py"

# The scope rule (ADR-172 item 4, #1325, 2026-10-29): every public symbol in
# these paths must have a test; CORE writes the missing ones. A path ending in
# "/" is a directory. It replaced the hand-kept include_files list of 134 files,
# all of which stay in scope; the scope grows to every file under src/mind/,
# src/will/ and src/api/. exclude_paths names exceptions (none yet).
include_paths:
  - "src/mind/"
  - "src/will/"
  - "src/api/"
  # The pure-function file that proves the generator's success path (#638).
  - "src/body/self_healing/placeholder_fixer_service.py"
exclude_paths: []

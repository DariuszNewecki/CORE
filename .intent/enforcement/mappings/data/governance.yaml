mappings:
  data.ssot.database_primacy:
    engine: ast_gate
    params:
      check_type: forbidden_assignments
      targets: [ "LLM_MODELS", "AGENT_ROLES", "SYSTEM_DOMAINS" ]
    scope:
      applies_to:
        - "src/**/*.py"

  data.security.no_raw_secrets:
    engine: regex_gate
    params:
      forbidden_patterns:
        - "(sk-[a-zA-Z0-9]{32,})"
        - "AI[a-zA-Z0-9]{32,}"
        - "PASSWORD\\s*=\\s*['\"][^'\"]+['\"]"
        - "ghp_[a-zA-Z0-9]{36}"
        - "ghs_[a-zA-Z0-9]{36}"
        - "gho_[a-zA-Z0-9]{36}"
        - "ghu_[a-zA-Z0-9]{36}"
        - "github_pat_[a-zA-Z0-9_]{22,}"
        - "xox[bapr]-[0-9]+-[0-9]+-[a-zA-Z0-9]+"
        - "AKIA[0-9A-Z]{16}"
        - "ASIA[0-9A-Z]{16}"
        - "-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"
        - "(?i)(password|api_key|secret_key)\\s*=\\s*['\"][^'\"]{8,}['\"]"
    scope:
      applies_to: [ "src/**/*.py", "var/logs/*.jsonl" ]

  data.contracts.layer_scope_coherence:
    engine: contracts_gate
    params:
      check_type: layer_scope_coherence
    scope:
      applies_to: []

  data.contracts.asymmetric_contract_findings:
    engine: contracts_gate
    params:
      check_type: asymmetric_contract_findings
      lookback_hours: 24
    scope:
      applies_to: []

  data.contracts.rule_binding_iceberg:
    engine: contracts_gate
    params:
      check_type: rule_binding_iceberg
      lookback_hours: 24
      min_findings: 10
      max_distinct_files: 3
    scope:
      applies_to: []

  data.contracts.persistence_reach_coherence:
    engine: contracts_gate
    params:
      check_type: persistence_reach_coherence
    scope:
      applies_to: []


mappings:

  infrastructure.constitutional_documentation:
    engine: regex_gate
    params:
      check_type: docstring_content
      required_patterns:
        - "CONSTITUTIONAL AUTHORITY"
        - "AUTHORITY LIMITS"
    scope:
      applies_to:
        - "src/body/services/service_registry.py"
        - "src/shared/infrastructure/database/session_manager.py"
        - "src/shared/infrastructure/config_service.py"

  infrastructure.service_registry.no_conditional_loading:
    engine: regex_gate
    params:
      forbidden_patterns:
        - "if.*priority"
        - "if.*critical"
        - "if.*important"
        - "high_priority"
        - "low_priority"
    scope:
      applies_to:
        - "src/body/services/service_registry.py"

  infrastructure.no_bare_except:
    engine: regex_gate
    params:
      forbidden_patterns:
        - "except:\\s*pass"
        - "except Exception:\\s*pass"
        - "except BaseException:\\s*pass"
        - "except BaseException\\s+as\\s+\\w+:\\s*pass"
        - "except Exception\\s+as\\s+\\w+:\\s*pass"
    scope:
      applies_to:
        - "src/shared/infrastructure/**/*.py"


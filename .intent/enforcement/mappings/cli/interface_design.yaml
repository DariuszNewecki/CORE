mappings:
  cli.resource_first:
    engine: cli_gate
    params:
      check_type: resource_first
      min_depth: 2
      max_depth: 3
    scope:
      applies_to: ["src/cli/**/*.py"]

  cli.no_layer_exposure:
    engine: cli_gate
    params:
      check_type: no_layer_exposure
      forbidden_resources: ["mind", "body", "will", "manage", "check", "fix"]
    scope:
      applies_to: ["src/cli/**/*.py"]

  cli.standard_verbs:
    engine: cli_gate
    params:
      check_type: standard_verbs
      allowed_verbs:
        - accept
        - accessibility
        - actions
        - adopt-pack
        - analyze
        - apply
        - apply-merge
        - approve
        - audit
        - audit-duplicates
        - author
        - auto-apply
        - baseline
        - bootstrap
        - build
        - change_password
        - chat
        - check
        - check-imports
        - check-tree
        - check-ui
        - claim
        - clarity
        - cleanup
        - complexity
        - consequence-chain
        - coverage
        - create
        - dashboard
        - delete
        - digest
        - docs
        - docstrings
        - down
        - drift
        - execute
        - explain
        - export
        - export-context
        - export-run
        - fix-atomic
        - fix-ids
        - forensics
        - format
        - format-imports
        - gap-analysis
        - generate
        - get
        - health
        - import
        - info
        - ingest
        - inspect
        - legacy
        - lint
        - list
        - logging
        - login
        - logout
        - migrate
        - new
        - next
        - onboard
        - patterns
        - promote
        - propose
        - purge
        - query
        - rebuild
        - refactor
        - refactor-settings
        - refusals
        - reject
        - remediate
        - repair-counts
        - report
        - resolve
        - resolve-duplicates
        - restart
        - rewire
        - rewire-imports
        - run
        - sandbox-check
        - score
        - scout
        - search
        - self-check
        - set
        - show
        - start
        - stats
        - status
        - strategic_audit
        - suggest
        - summary
        - supersede
        - sync
        - sync-code
        - sync-env
        - sync-registry
        - tag
        - test
        - test-stability
        - traces
        - triage
        - up
        - validate
        - validate-env
        - verify
        - whoami
    scope:
      applies_to: ["src/cli/**/*.py"]

  cli.dangerous_explicit:
    engine: cli_gate
    params:
      check_type: dangerous_explicit
    scope:
      applies_to: ["src/cli/**/*.py"]

  cli.async_execution:
    engine: cli_gate
    params:
      check_type: async_execution
      required_decorator: "core_command"
    scope:
      applies_to: ["src/cli/**/*.py"]

  cli.discovery_strict:
    engine: cli_gate
    params:
      check_type: discovery_strict
      loader: "src/cli/admin_cli.py"
    scope:
      applies_to: ["src/cli/**/*.py"]

  cli.help_required:
    engine: cli_gate
    params:
      check_type: help_required
    scope:
      applies_to: ["src/cli/**/*.py"]

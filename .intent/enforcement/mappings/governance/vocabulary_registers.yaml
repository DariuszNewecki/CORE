# .intent/enforcement/mappings/governance/vocabulary_registers.yaml
#
# Enforcement mapping for governance.vocabulary_registers rules.
# Declared under CORE-Vocabulary-Registers.md and Article I S5 of the
# Constitution.
#
# 2026-08-31 (ADR-158, #854): governance.vocabulary_registers.diagnostic_fields_must_be_uppercase
# is retired -- see .intent/rules/governance/vocabulary_registers.json for the
# full disposition. governance.vocabulary_registers.operational_fields_must_be_lowercase
# moved from engine: python_runtime (declared but never implemented -- no
# consumer existed for either rule; #854) to engine: artifact_gate. Real
# implementation: src/mind/logic/engines/artifact_gate.py::_check_register_casing,
# a context-level check dispatched via verify_context (walks the whole .intent/
# tree once per audit, not per matched file). The same underlying casing
# grammar is separately enforced as a fail-closed bootstrap guard inside
# IntentRepository.__init__ (src/shared/infrastructure/intent/intent_repository.py,
# via validate_register_casing in
# src/shared/infrastructure/intent/vocabulary_register_validator.py) -- CORE
# refuses to even load a .intent/ tree with a casing violation in this scope,
# strict=True by default. That boot guard means, in production, this
# artifact_gate rule's own scope can never actually observe a violation --
# a bad .intent/ tree never gets far enough to be audited. The rule stays
# "verified" against its own real mechanism (proven via injected temp
# fixtures in the G2 census, not against live traffic), and the boot guard is
# the reason production traffic never exercises it -- stated here explicitly
# per the #854 review rather than left implicit.
#
# No auto_remediation entries beyond the DELEGATE placeholders already
# present: register casing violations require intentional human correction
# of governance artifact authoring.
#
# scope.excludes for the surviving rule covers .intent/enforcement/mappings/**
# as a structural guard -- mapping files have no register fields to validate
# (their schema in enforcement_mapping.schema.json defines only engine,
# params, scope, governed_exclusions, requires_findings_from).

mappings:
  # RULE: governance.vocabulary_registers.operational_fields_must_be_lowercase
  # Verifies that values in operational-register fields of .intent/ artifacts
  # use lowercase_snake_case (authority, phase, enforcement, status, class,
  # ordering.mode -- path-qualified, see artifact_gate.py's
  # _REGISTER_GOVERNED_PATHS), plus the operational-register enum vocabularies
  # declared in .intent/META/enums.json (authority, phase, strength,
  # audit_severity -- see _REGISTER_ENUMS_RATIFIED_NAMES).
  governance.vocabulary_registers.operational_fields_must_be_lowercase:
    engine: artifact_gate
    params:
      check_type: register_casing_validation
    scope:
      applies_to:
        - ".intent/**/*.yaml"
        - ".intent/**/*.json"
      excludes:
        - ".intent/META/**"
        - ".intent/enforcement/mappings/**"

  # RULE: governance.vocabulary_registers.diagnostic_fields_must_be_uppercase
  # RETIRED 2026-08-31 (ADR-158, #854) -- see the rule document for the full
  # disposition. passive_gate/attestation_class D satisfies the ADR-066
  # all_rules_mapped invariant while dispatching zero findings, matching the
  # precedent set by logic.di.no_global_session
  # (.intent/enforcement/mappings/architecture/async_logic.yaml).
  governance.vocabulary_registers.diagnostic_fields_must_be_uppercase:
    engine: passive_gate
    params:
      attestation_class: "D"
    scope:
      applies_to:
        - "src/**/*.py"

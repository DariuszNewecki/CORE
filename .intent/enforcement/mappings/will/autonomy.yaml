mappings:

    autonomy.tracing.mandatory:
      engine: ast_gate
      params:
        check_type: generic_primitive
        selector:
          inherits_from: TracedAgentMixin
        requirement:
          check_type: required_calls
          calls: ["self.tracer.record"]
      scope:
        applies_to: ["src/will/agents/**/*.py"]

    autonomy.reasoning.policy_alignment:
      engine: regex_gate
      params:
        required_patterns:
          - "quality_assurance"
      scope:
        applies_to: ["src/will/agents/planner_agent.py"]

    autonomy.remediation.min_confidence_floor:
      engine: artifact_gate
      params:
        check_type: remediation_confidence_floor
      scope:
        applies_to:
          - ".intent/enforcement/remediation/auto_remediation.yaml"
          - ".intent/enforcement/config/governance_paths.yaml"

  # .intent/enforcement/mappings/will/planning.yaml
  # Constitutional enforcement for planning phase - V2.3
  # Status: HARDENED (P1.3)
  #
  # CHANGE LOG V2.3:
  # - planning.no_code_generation: llm_gate -> passive_gate
  #   Rationale: Already enforced deterministically in base_planner.parse_and_validate_plan().
  #   LLM gate was redundant AND a bypass risk -- an LLM outage could block all planning.
  # - planning.conceptual_only: llm_gate -> passive_gate
  #   Same rationale. The params-only check runs in base_planner.py on every plan.
  # - planning.file_path_validation and planning.trace_mandatory: unchanged (deterministic).
  #
  # LAW HYGIENE 2026-04-19: Removed stale "src/will/agents/specification_agent.py"
  # from planning.trace_mandatory scope -- that file does not exist in the codebase
  # and the reference had no other callers. No behavior change, pure cleanup.

  mappings:
    # 1. LAW: Planner must not generate non-empty code.
    # ENFORCEMENT: Deterministic check in base_planner.parse_and_validate_plan().
    # Raises PlanExecutionError if params.code is truthy (non-empty). passive_gate
    # acknowledges this substrate enforcement so the rule is visible in coverage
    # reports. WORDING CORRECTION (#849): the rule statement now says "non-empty"
    # rather than "not None" -- None and "" are both compliant, matching the
    # deployed truthiness check; see .intent/rules/will/planning.json rationale.
    planning.no_code_generation:
      engine: passive_gate
      params:
        attestation_class: "A"
        enforced_by: "will.agents.base_planner.parse_and_validate_plan"
        enforcement_note: >
          Runtime check raises PlanExecutionError if ExecutionTask.params.code is
          truthy (non-empty). None and "" are compliant. LLM gate removed (P1.3):
          LLM failure must not block planning.
      scope:
        applies_to:
          - "src/will/agents/base_planner.py"

    # 2. LAW: Plans should be conceptual only -- advisory, mapping removed (#849).
    # base_planner.parse_and_validate_plan does NOT implement the scan this
    # mapping used to claim ("check json.dumps(params_dict)" per the rule's
    # own rationale) -- grep for json.dumps/conceptual/params_dict in that
    # file returns nothing. Only the narrower planning.no_code_generation
    # check (the 'code' key specifically) actually runs. Evaluated by
    # governor/human review until a mechanical definition of "conceptual
    # content" exists. See .intent/rules/will/planning.json for the
    # promotion condition. Historical marker only.

    # 3. LAW: Paths must be valid.
    # Regex Gate (deterministic) -- unchanged.
    planning.file_path_validation:
      engine: regex_gate
      params:
        forbidden_patterns:
          - "src / "
        message: "Detected invalid path string format in logic."
      scope:
        applies_to:
          - "src/will/agents/planner_agent.py"
          - "src/will/agents/base_planner.py"

    # 4. LAW: Decisions must be traced.
    # AST Gate (deterministic) -- unchanged.
    planning.trace_mandatory:
      engine: ast_gate
      params:
        check_type: required_calls
        selector:
          name_regex: "^(create_|execute_|elaborate_)"
        calls:
          - "self.tracer.record"
      scope:
        applies_to:
          - "src/will/agents/planner_agent.py"

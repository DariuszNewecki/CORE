mappings:
  modularity.needs_split:
    engine: ast_gate
    params:
      check_type: modularity
      check_method: check_needs_split
      max_lines: 500
    scope:
      applies_to: ["src/**/*.py"]

  modularity.class_too_large:
    engine: ast_gate
    params:
      check_type: modularity
      check_method: check_class_too_large
      max_lines: 500
    scope:
      applies_to: ["src/**/*.py"]

    governed_exclusions: []

  modularity.needs_refactor:
    engine: ast_gate
    params:
      check_type: modularity
      check_method: check_needs_refactor
      max_concerns: 3
    scope:
      applies_to: ["src/**/*.py"]


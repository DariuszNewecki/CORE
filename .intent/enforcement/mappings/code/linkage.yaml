  mappings:
    linkage.assign_ids:
      engine: ast_gate
      params:
        check_type: id_anchor
      scope:
        applies_to: ["src/**/*.py"]

    linkage.duplicate_ids:
      engine: ast_gate
      params:
        check_type: duplicate_ids
      scope:
        applies_to: ["src/**/*.py"]

    linkage.no_orphan_ids:
      engine: ast_gate
      params:
        check_type: orphan_ids
      scope:
        applies_to: ["src/**/*.py"]

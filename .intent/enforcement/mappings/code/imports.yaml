mappings:
  code.imports.must_resolve:
    engine: workflow_gate
    params:
      check_type: import_resolution_check
      tools:
        - tool: ruff
          args: ["check", "--select", "F821,F401"]
        - tool: mypy
          args: ["--no-error-summary"]
          filter: "import-not-found"
    scope:
      applies_to: ["src/**/*.py"]

  code.imports.no_stale_namespace:
    engine: workflow_gate
    params:
      check_type: import_resolution_check
      tools:
        - tool: mypy
          args: ["--no-error-summary"]
          filter_all: ["import-not-found", "features."]
    scope:
      applies_to: ["src/**/*.py"]

  code.imports.no_resolution_suppression:
    engine: regex_gate
    params:
      forbidden_patterns:
        - "type:\\s*ignore\\[[^\\]]*\\bimport-not-found\\b"
        - "^\\s*(?:from\\s+\\S+\\s+)?import\\s.*#\\s*type:\\s*ignore\\s*$"
    scope:
      applies_to: ["src/**/*.py"]

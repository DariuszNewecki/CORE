mappings:
  metadata.semantic_preservation:
    engine: ast_gate
    params:
      check_type: metadata_only_diff
    scope:
      applies_to:
        - "src/**/*.py"

  metadata.operations.comment_length_limit:
    engine: ast_gate
    params:
      check_type: metadata_only_diff
      max_comment_length: 120
    scope:
      applies_to:
        - "src/**/*.py"


  mappings:
    # LAW: Every public symbol MUST have a stable '# ID:' anchor
    # Check type: ast_gate (Context-Aware definition lookup)
    purity.stable_id_anchor:
      engine: ast_gate
      params:
        check_type: id_anchor
      scope:
        applies_to:
          - "src/**/*.py"

    # 3. LAW: Metadata belongs in the DB, not the code (@capability, @owner)
    # Check type: ast_gate (Decorator inspection)
    purity.no_metadata_decorators:
      engine: ast_gate
      params:
        check_type: forbidden_decorators
        forbidden:
          - "capability"
          - "meta"
          - "owner"
          - "domain"
      scope:
        applies_to:
          - "src/**/*.py"

    # LAW: Public symbols MUST have docstrings (not placeholders).
    # Narrowed scope (#310): the periodic audit checks only public-surface
    # entry points where docstrings are part of the external contract.
    # ADR-047: engine moved from llm_gate to ast_gate. The presence check
    # is structural (ast.get_docstring is not None), so it does not need
    # a language model. (Placeholder docstring content is no longer
    # separately enforced -- purity.no_todo_placeholders was retired, ADR-114.)
    # Moving off llm_gate eliminated verdict instability (see #311) and frees
    # local-LLM concurrency budget for genuinely semantic rules.
    purity.docstrings.required:
      engine: ast_gate
      params:
        check_type: docstrings_present
      scope:
        applies_to:
          - "src/api/**/*.py"
          - "src/cli/commands/**/*.py"
          - "src/will/workers/**/*.py"
          - "src/body/atomic/**/*.py"

    # 5. LAW: Code MUST NOT contain exact AST duplicates
    purity.no_ast_duplication:
      engine: knowledge_gate
      params:
        check_type: ast_duplication
        threshold: 1.0
      scope:
        applies_to:
          - "src/**/*.py"
        excludes:
          - "src/shared/infrastructure/intent/intent_repository.py"
          - "src/shared/infrastructure/specs/specs_repository.py"

    # 6. LAW: Code SHOULD NOT contain semantic duplicates
    purity.no_semantic_duplication:
      engine: knowledge_gate
      params:
        check_type: semantic_duplication
        threshold: 0.85
      scope:
        applies_to:
          - "src/**/*.py"

    # LAW: A refactor MUST preserve domain logic (no silent deletion of behavior).
    # This rule compares a proposed code DIFF to the original. The periodic
    # audit pipeline has no diff -- it scans current-state files. The effective
    # scope is the proposal-execution pipeline (fix.modularity, build.tests),
    # which receives old/new pairs from the executor. Audit scope is the empty
    # set so periodic sensors skip the rule without removing it from the
    # registry (ADR-043 D7 / #310).
    purity.logic_conservation:
      engine: llm_gate
      params:
        instruction: >
          Compare the proposed refactor to the original code.
          Verify that no significant domain logic has been deleted.
          If the code size shrunk by more than 50%, ensure it was due to
          de-duplication, not logic removal.
        rationale: "Evaluated at proposal-execution time, not periodic audit."
      scope:
        applies_to: []


    purity.no_dead_code:
      engine: workflow_gate
      params:
        check_type: dead_code_check
        tool: "vulture"
        # 60 is the confidence vulture gives unused functions, methods and
        # classes; at 80 the rule could see none of them (2026-10-04
        # investigation). Proposal 0006, 2026-10-09.
        confidence: 60
        report_kinds: [class, function, method, property]
        # Registrations call these by decorator; vulture cannot see the call.
        ignore_decorators:
          - "@*.command"
          - "@*.get"
          - "@*.post"
          - "@*.put"
          - "@*.delete"
          - "@*.patch"
          - "@core_command"
          - "@command_meta"
          - "@atomic_action"
          - "@register_action"
          - "@field_validator"
          - "@model_validator"
          - "@async_command"
          - "@*.on_event"
          - "@*.exception_handler"
          - "@*.middleware"
        # Live but invisible to vulture: engines found by EngineRegistry's
        # package scan, test hooks, and a logging.Formatter override. Worker,
        # phase and check_method names are read from .intent/ by the check.
        ignore_names:
          - "*GateEngine"
          - "GRCJudgeEngine"
          - "reset_*"
          - "*_for_test"
          - "clear_eval_cache"
          - "dispose_all_engines_for_current_loop_only"
          - "formatTime"
        # Ratchet (governor 2026-10-09): candidates known on 2026-10-09 are
        # recorded there and not reported; new dead code is. Work the list
        # down by deleting entries together with the code they name.
        baseline: "enforcement/config/dead_code_baseline.yaml"
      scope:
        applies_to:
          - "src/**/*.py"

    # LAW: tempfile.* without explicit dir= resolves to /tmp/ (CLAUDE.md prohibition).
    # AST-detected: presence of dir= kwarg on TemporaryDirectory/NamedTemporaryFile/
    # mkdtemp/mkstemp; outright forbid tempfile.gettempdir(). The dir= VALUE is not
    # statically validated -- trusting the kwarg is present catches the four real-world
    # silent siblings (#508) and any future regression at the same level of confidence.
    purity.tempfile_default_dir:
      engine: ast_gate
      params:
        check_type: tempfile_default_dir
      scope:
        applies_to:
          - "src/**/*.py"


    # 7. LAW: Production source files MUST be reachable from a declared entry point.
    purity.no_orphan_files:
      engine: knowledge_gate
      params:
        check_type: orphan_file_check
        # Real entry points only (2026-10-09, proposal 0005). A directory is listed
        # only when CORE loads its modules by scanning, not by import: engines
        # (registry iter_modules) and the component packages (discover_components).
        # Workers and phases are seeded from .intent/ by the check itself.
        entry_points:
          - "src/cli/admin_cli.py"                # the core-admin console script
          - "src/api/main.py"                     # uvicorn api.main:app
          - "src/mind/logic/engines/"             # EngineRegistry scans the package
          - "src/body/analyzers/"                 # discover_components
          - "src/body/evaluators/"                # discover_components
          - "src/will/strategists/"               # discover_components
          - "infra/scripts/render_ledger_seed.py" # test-DB reset (infra/scripts/reset_test_db.sh)
        excludes:
          - "src/**/__init__.py"
          - "src/**/__main__.py"
          - "src/**/conftest.py"
          - "src/shared/infrastructure/repositories/db/schema_dump.py" # migration-test tooling (ADR-162 release-candidate and hop-equivalence tests)
          - "src/will/orchestration/process_orchestrator.py" # parked V2.3 adaptive-workflow scaffold (#590 closure 2); kept by governor 2026-10-09
          - "src/api/rate_limiter.py" # imported by core-platform (platform_api/v1/auth_routes.py: check_rate), an external consumer outside this repo
      scope:
        applies_to:
          - "src/**/*.py"

  mappings:
    purity.stable_id_anchor:
      engine: ast_gate
      params:
        check_type: id_anchor
      scope:
        applies_to:
          - "src/**/*.py"

    purity.no_metadata_decorators:
      engine: ast_gate
      params:
        check_type: forbidden_decorators
        forbidden:
          - "capability"
          - "meta"
          - "owner"
          - "domain"
      scope:
        applies_to:
          - "src/**/*.py"

    purity.docstrings.required:
      engine: ast_gate
      params:
        check_type: docstrings_present
      scope:
        applies_to:
          - "src/api/**/*.py"
          - "src/cli/commands/**/*.py"
          - "src/will/workers/**/*.py"
          - "src/body/atomic/**/*.py"

    purity.no_ast_duplication:
      engine: knowledge_gate
      params:
        check_type: ast_duplication
        threshold: 1.0
      scope:
        applies_to:
          - "src/**/*.py"
        excludes:
          - "src/shared/infrastructure/intent/intent_repository.py"
          - "src/shared/infrastructure/specs/specs_repository.py"

    purity.no_dead_code:
      engine: workflow_gate
      params:
        check_type: dead_code_check
        tool: "vulture"
        confidence: 60
        report_kinds: [class, function, method, property]
        ignore_decorators:
          - "@*.command"
          - "@*.get"
          - "@*.post"
          - "@*.put"
          - "@*.delete"
          - "@*.patch"
          - "@core_command"
          - "@command_meta"
          - "@atomic_action"
          - "@register_action"
          - "@field_validator"
          - "@model_validator"
          - "@async_command"
          - "@*.on_event"
          - "@*.exception_handler"
          - "@*.middleware"
        ignore_names:
          - "*GateEngine"
          - "GRCJudgeEngine"
          - "reset_*"
          - "*_for_test"
          - "clear_eval_cache"
          - "dispose_all_engines_for_current_loop_only"
          - "formatTime"
        baseline: "enforcement/config/dead_code_baseline.yaml"
      scope:
        applies_to:
          - "src/**/*.py"

    purity.tempfile_default_dir:
      engine: ast_gate
      params:
        check_type: tempfile_default_dir
      scope:
        applies_to:
          - "src/**/*.py"

    purity.no_orphan_files:
      engine: knowledge_gate
      params:
        check_type: orphan_file_check
        entry_points:
          - "src/cli/admin_cli.py"                # the core-admin console script
          - "src/api/main.py"                     # uvicorn api.main:app
          - "src/mind/logic/engines/"             # EngineRegistry scans the package
          - "src/body/analyzers/"                 # discover_components
          - "src/body/evaluators/"                # discover_components
          - "src/will/strategists/"               # discover_components
          - "infra/scripts/render_ledger_seed.py" # test-DB reset (infra/scripts/reset_test_db.sh)
        excludes:
          - "src/**/__init__.py"
          - "src/**/__main__.py"
          - "src/**/conftest.py"
          - "src/shared/infrastructure/repositories/db/schema_dump.py" # migration-test tooling (ADR-162 release-candidate and hop-equivalence tests)
          - "src/will/orchestration/process_orchestrator.py" # parked V2.3 adaptive-workflow scaffold (#590 closure 2); kept by governor 2026-10-09
          - "src/api/rate_limiter.py" # imported by core-platform (platform_api/v1/auth_routes.py: check_rate), an external consumer outside this repo
      scope:
        applies_to:
          - "src/**/*.py"

mappings:
  architecture.channels.logic_logger_only:
    engine: ast_gate
    params:
      check_type: no_print_statements
    scope:
      applies_to:
        - "src/**/*.py"

  architecture.channels.logic_no_terminal_rendering:
    engine: ast_gate
    params:
      check_type: forbidden_imports_and_calls
      forbidden_imports:
        - "rich.console"
        - "rich.table"
        - "rich.panel"
        - "rich.pretty"
        - "rich.tree"
        - "rich.progress"
        - "rich.markdown"
        - "rich.live"
        - "rich.prompt"
        - "pprint"
      forbidden_calls:
        - "Console"
        - "console.print"
        - "Table"
        - "Panel"
        - "typer.echo"
        - "sys.stdout.write"
        - "sys.stderr.write"
        - "pprint.pprint"
        - "console.log"
        - "console.rule"
    scope:
      applies_to:
        - "src/**/*.py"
      excludes:
        - "src/cli/**"
        - "src/cli/utils/**"

  architecture.channels.api_structured_output_only:
    engine: ast_gate
    params:
      check_type: forbidden_imports_and_calls
      forbidden_imports:
        - "rich.console"
        - "rich.table"
        - "rich.panel"
        - "rich.pretty"
        - "rich.tree"
        - "rich.progress"
        - "rich.markdown"
        - "rich.live"
        - "rich.prompt"
        - "pprint"
      forbidden_calls:
        - "Console"
        - "console.print"
        - "Table"
        - "Panel"
        - "typer.echo"
        - "print"
        - "sys.stdout.write"
        - "sys.stderr.write"
        - "pprint.pprint"
        - "console.log"
        - "console.rule"
    scope:
      applies_to:
        - "src/api/**/*.py"

  architecture.channels.logger_not_presentation:
    engine: ast_gate
    params:
      check_type: logger_not_presentation
    scope:
      applies_to:
        - "src/**/*.py"


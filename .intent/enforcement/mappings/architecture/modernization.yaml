    mappings:
      modernization.legacy_signal:
        engine: regex_gate
        params:
          forbidden_patterns:
            - "(?m)^from\\s+\\S+(_v2|_legacy|_old|_deprecated)\\s+import"
            - "#.*(?i:\\b(legacy|deprecated|shim|backward.{0,5}compat)\\b)"
            - "def\\s+\\w+\\([^)]*\\b(output_mode|silent|_compat|_unused)\\b[^)]*\\)"
        scope:
          applies_to:
            - "src/**/*.py"
          excludes:
            - "**/__init__.py"
            - "src/body/introspection/sync/visitor.py"           # detects deprecation markers
            - "src/body/introspection/sync/engine.py"            # tracks the deprecated status
            - "src/will/workers/dead_shim_sensor.py"             # detects dead shims
            - "src/mind/logic/engines/cli_gate/checks/standard_verbs.py"  # skips hidden deprecated aliases
            - "src/shared/cli/app_introspection.py"              # skips hidden deprecated aliases
            - "src/api/v1/project_routes.py"                     # POST /project/docs deprecation, sunset 2027-04-03 (ADR-087)
            - "src/body/services/grc/gap_analysis_service.py"    # GRCGapAnalysisService alias kept by ADR-121 D7

      modernization.dead_shim:
        engine: passive_gate
        params:
          attestation_class: "C"
          enforcement_note: >
            DeadShimSensor (will.workers.dead_shim_sensor,
            .intent/workers/dead_shim_sensor.yaml) posts a
            modernization.dead_shim finding for every self-declared
            deprecated symbol the knowledge graph shows unused.
        scope:
          applies_to:
            - "src/**/*.py"

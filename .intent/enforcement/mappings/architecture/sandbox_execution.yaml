mappings:
  architecture.sandbox.tests_run_in_sandbox:
    engine: regex_gate
    params:
      check_type: pattern_match
      patterns:
        - '\[\s*["'']pytest["'']\s*,'
        - '["'']-m["'']\s*,\s*["'']pytest["'']'
        - '\bpytest\.main\('
      message: >
        pytest started outside the sandbox. Run repository tests through
        body.sandbox (run_in_sandbox, or repo_tests.run_tests for an
        ActionResult); ADR-132 D10.10.
    scope:
      applies_to:
        - "src/**/*.py"
      excludes:
        - "src/body/sandbox/**"
        - "src/mind/logic/engines/ast_gate/checks/modularity_checks.py"

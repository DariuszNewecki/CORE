mappings:

  architecture.flows.atomic_action_must_not_compose:
    engine: regex_gate
    params:
      forbidden_patterns:
        - "action_executor\\.execute\\("
        - "ActionExecutor\\(.*\\)\\.execute\\("
    scope:
      applies_to:
        - "src/body/atomic/**/*.py"

  architecture.flows.flow_must_not_post_to_blackboard:
    engine: regex_gate
    params:
      forbidden_patterns:
        - "post_finding\\("
        - "post_report\\("
        - "post_heartbeat\\("
        - "(?i)INSERT\\s+INTO\\s+(?:core\\.)?blackboard_entries"
    scope:
      applies_to:
        - "src/body/flows/**/*.py"

  architecture.flows.flow_must_not_create_proposals:
    engine: regex_gate
    params:
      forbidden_patterns:
        - "Proposal\\("
        - "ProposalAction\\("
        - "proposal_repository\\.save\\("
        - "submit_proposal\\("
    scope:
      applies_to:
        - "src/body/flows/**/*.py"

  architecture.flows.flow_declared_in_intent:
    engine: regex_gate
    params:
      forbidden_patterns:
        - "register_flow\\("
    scope:
      applies_to:
        - "src/**/*.py"


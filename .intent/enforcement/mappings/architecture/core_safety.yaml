# .intent/enforcement/mappings/architecture/core_safety.yaml
#
# Core architectural safety checks enforced via deterministic gates.
# These are the structural perimeter rules -- they verify the shape of
# the codebase before any semantic analysis begins.

mappings:
  # =========================================================================
  # STRUCTURAL: Module-level async engine prohibition
  # =========================================================================
  architecture.no_module_async_engine:
    engine: ast_gate
    params:
      check_type: no_module_level_async_engine
    scope:
      applies_to:
        - "src/**/*.py"

  # =========================================================================
  # IMMUTABILITY: Constitution is read-only to code
  # =========================================================================
  architecture.constitution_read_only:
    engine: passive_gate
    params:
      attestation_class: "A"
      enforced_by: "body.governance.intent_guard.IntentGuard"
      enforcement_note: >
        Runtime check -- writes under .intent/constitution/ are refused by IntentGuard's
        tier-1 .intent/ invariant (reported as
        governance.constitution.read_only); see that rule's mapping in
        governance_basics.yaml for the full path. The previous glob_gate
        mapping (.intent/constitution/** over src/**/*.py) could never match (#936).
    scope:
      applies_to:
        - "src/body/governance/intent_guard.py"

  # =========================================================================
  # IMMUTABILITY: META schema is read-only to code
  # =========================================================================
  architecture.meta_read_only:
    engine: passive_gate
    params:
      attestation_class: "A"
      enforced_by: "body.governance.intent_guard.IntentGuard"
      enforcement_note: >
        Runtime check -- writes under .intent/META/ are refused by IntentGuard's
        tier-1 .intent/ invariant (reported as
        governance.constitution.read_only); see that rule's mapping in
        governance_basics.yaml for the full path. The previous glob_gate
        mapping (.intent/META/** over src/**/*.py) could never match (#936).
    scope:
      applies_to:
        - "src/body/governance/intent_guard.py"

  mappings:
    quality.type_safety:
      engine: workflow_gate
      params:
        check_type: mypy_check
      scope:
        applies_to:
          - "src/**/*.py"

    quality.no_attr_call_suppression:
      engine: regex_gate
      params:
        forbidden_patterns:
          - "type:\\s*ignore\\[[^\\]]*\\b(?:attr-defined|call-arg)\\b"
      scope:
        applies_to:
          - "src/**/*.py"

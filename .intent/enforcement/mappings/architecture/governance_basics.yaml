 # .intent/enforcement/mappings/architecture/governance_basics.yaml
  #
  # Governance enforcement mappings for constitutional compliance

  mappings:
    # 1. Protection of the Constitution itself
    # ENFORCEMENT: runtime refusal at the write chokepoint, not an audit
    # engine pretending to perform it (#936; precedent:
    # architecture.execution_write.repository_containment).
    governance.constitution.read_only:
      engine: passive_gate
      params:
        attestation_class: "A"
        enforced_by: "body.governance.intent_guard.IntentGuard"
        enforcement_note: >
          Runtime check -- IntentGuard.check_transaction tier 1 (hard invariant)
          refuses every write whose path is under .intent/ and reports it as
          governance.constitution.read_only. Every governed write reaches it
          through FileHandler, which classifies .intent/ paths as
          governed-artifact, so the ephemeral-scratch short-circuit never
          applies. Writes that bypass FileHandler are the blocking
          governance.mutation_surface.filehandler_required. A static scan of
          src/ cannot see a write target; the previous glob_gate mapping
          (.intent/** over src/**/*.py) could never match (#936).
      scope:
        applies_to:
          - "src/body/governance/intent_guard.py"

    # 2. THE BLOCKING LAW: Logic mutations must be governed.
    # This list EXCLUDES components that are allowed to use direct writes.
    #
    # Forbidden surface converged 2026-05-31 (#489 / ADR-077 S6 step 3):
    # the check now derives its forbidden set from
    # .intent/taxonomies/filesystem_operations.yaml filtered by
    # op_class == "write". The previous forbidden_additional block
    # (os.*/shutil.*/aiofiles.open) is now redundant with the watched:
    # block of the taxonomy; aiofiles.open was dropped (no src/ consumer,
    # legacy defensive coverage). The S4 gap-set (mkdir, makedirs, touch,
    # symlink, link, chmod) is now covered by both leaf-matched pathlib
    # entries and qualified-matched os.* entries. Variable-receiver
    # `p.replace(...)` / `p.rename(...)` remain a pre-existing accepted
    # gap -- see #489 migration trap. Bare-import resolution for the
    # qualified entries (closed in #488, 2026-05-30) is preserved by
    # ASTHelpers.resolve_qualified_name; star imports and dynamic imports
    # remain out of reach.
    governance.logic_mutation.governed:
      engine: ast_gate
      params:
        check_type: no_direct_writes
      scope:
        applies_to:
          - "src/**/*.py"
        excludes:
          # --- THE BOOTSTRAP: Infrastructure that enables governance ---
          # These components implement the governed surface itself and must
          # operate before governance is active (Load Phase)
          - "src/body/infrastructure/storage/file_handler.py" # IS the governed surface (moved from shared by ADR-126)
          - "src/shared/path_utils.py" # Path resolution utilities
          - "src/body/services/crate_processing_service.py" # Crate generation infrastructure
          - "src/shared/infrastructure/validation/ruff_linter.py" # Linting infrastructure
          # Subprocess sanctuary -- also owns ephemeral worktree directory
          # cleanup (/tmp/core-action-sandbox-*) per ADR-071 D2.2.
          # shutil.rmtree fallback covers crashed-git worktrees the orphan
          # sweep can't reach (admin entry pruned, directory remains).
          - "src/shared/infrastructure/git_service.py" # Git + ephemeral worktree sanctuary
          # Runtime cache for ContextPackets -- operates beneath the
          # FileHandler abstraction on var/cache/context/ ephemera; not a
          # constitutional artifact surface. Same shape as runtime_validator
          # and ruff_linter above.
          - "src/shared/infrastructure/context/cache.py" # Runtime cache infrastructure
          # --- ADDED 2026-05-31 (#507 Phase 2 drain -- Tier 2 authority-scoped exclusions) ---
          # Each entry mirrored in mutation_surface.yaml's excludes set.
          # Per-line rationale; see #507 for the full disposition table.
          - "src/body/governance/key_management_service.py" # Security-sanctuary: chmod 0600 on private keying material; FileHandler exposes no chmod primitive
          - "src/shared/action_logger.py" # Bootstrap-tier: module-level singleton instantiated at import; append-mode action audit log; FileHandler has no append surface
          - "src/shared/infrastructure/storage/integrity_service.py" # Bootstrap-tier (circular): sibling of file_handler.py; SHA256 baseline writer validates governance, cannot depend on it
          # (2026-10-02: src/will/test_generation/sandbox.py exclusion removed -- the file has no direct write; ADR-166 D6 unit 1.)
          # --- ADDED 2026-06-29 (ADR-132 session-file + BYOR CLI out-of-repo ops) ---
          # Each entry mirrored in mutation_surface.yaml's excludes set.
          - "src/cli/logic/byor.py" # BYOR CLI: shutil.rmtree on external project staging dir (outside CORE repo root); cannot route through FileHandler
          - "src/cli/logic/scout.py" # BYOR Scout: inducted_path.unlink() on external target project's .intent/; outside CORE repo root
          # (2026-10-02: canary_janitor.py exclusion removed -- it deletes through
          # FileService/FileHandler now; work/ is ephemeral-scratch since #772.)
          # --- ADDED 2026-07-23 (ADR-155 isolated consequence-chain demo, Phase 1) ---
          # Mirrored in mutation_surface.yaml's excludes set.
          - "src/cli/logic/demo/isolation.py" # ADR-155 D3: writes run-identity marker + isolation-fingerprint records under CORE_DEMO_STATE_DIR (outside any repo root); FileHandler is repo-bound and refuses out-of-repo paths
          # --- ADDED 2026-09-15 (ADR-159 Note 2026-09-15, #894 Condition 2: materialized execution copy) ---
          # Mirrored in mutation_surface.yaml's excludes set.
          - "src/shared/infrastructure/intent/target_intent_assembly.py" # #894: assembles floor+overlay .intent/ and the execution copy under an evidence root (outside any repo root, by construction); FileHandler is repo-bound and hard-blocks the literal .intent/ prefix -- same limitation byor.py records
          # --- ADDED 2026-10-02 (ADR-119 Amendment 2026-10-02, #892: Generate bootstrap stage) ---
          # Mirrored in mutation_surface.yaml's excludes set.
          - "src/cli/logic/project_scaffold.py" # project new: delivers machinery floor + neutral skeleton into a new external target outside CORE's repo root; FileHandler is repo-bound and refuses out-of-repo paths (repository_containment) -- same limitation byor.py records
          # --- AUTONOMOUS CODE: Now enforced (no exclusions for self-healing) ---
          # Self-healing modules MUST route writes through FileHandler
          # (sandbox.py above is test-generation, not self-healing)

    # 3. Artifact mutations must be traceable via FileHandler.
    # Advisory -- automated detection not feasible for SHOULD-level requirement
    # without high false-positive risk. Verified by code review and FileHandler
    # usage convention.
    governance.artifact_mutation.traceable:
      engine: advisory
      params:
        note: >
          System artifacts, logs, and reports SHOULD be generated via FileHandler
          to ensure audit traceability. Enforced by architectural convention and
          code review. The SHOULD-level enforcement and diversity of write paths
          make automated detection impractical without unacceptable false-positive
          risk.
      scope:
        applies_to:
          - "src/**/*.py"

    governance.no_governance_bypass:
      engine: ast_gate
      params:
        check_type: forbidden_primitives
        forbidden:
          - "IntentGuard(bypass=True)"
          - "bypass_governance"
          - "disable_governance"
      scope:
        applies_to:
          - "src/**/*.py"
        excludes:
          - "tests/**"

    # Widened 2026-04-18:
    # - "Popen" (bare) catches `from subprocess import Popen; Popen(...)` --
    #   the bare-import form that previously bypassed the `subprocess.Popen`
    #   pattern because full_attr_name resolves to "Popen" without the prefix.
    # - subprocess variants (check_call, check_output, getoutput,
    #   getstatusoutput) -- all legitimate subprocess entry points that
    #   invoke commands but don't route through run/call/Popen.
    # - os process-spawn family (execv, execvp, execve, spawnv, spawnvp, fork) --
    #   alternative paths to process creation outside the os.system family.
    #
    # Deliberately NOT added (collision risk):
    # - Bare "call", "run", "fork" -- names too generic; would produce false
    #   positives on legitimate code (e.g., app.run(), func.call()).
    # - "builtins.eval" / "builtins.exec" / "builtins.compile" -- nobody writes
    #   these forms; the bare names are already caught.
    #
    # Bare-import gap closed 2026-05-30 (#488 sibling fix):
    # - `from os import system; system(...)` is now caught:
    #   check_forbidden_primitives resolves Name-form callees through the
    #   import alias map and matches the qualified form ("os.system")
    #   against the forbidden list. The "Popen" entry below is now redundant
    #   with bare-import resolution against "subprocess.Popen" but is kept
    #   as a belt-and-suspenders guard.
    governance.dangerous_execution_primitives:
      engine: ast_gate
      params:
        check_type: forbidden_primitives
        forbidden:
          # Original list
          - "eval"
          - "exec"
          - "compile"
          - "os.system"
          - "subprocess.Popen"
          - "subprocess.call"
          - "subprocess.run"
          # os.getenv / os.environ removed 2026-08-29 (#810): a config read
          # executes nothing, so it was never the risk this rule is named
          # for (eval/exec/compile/os.system/subprocess run arbitrary code;
          # os.environ.get(...) reads a string). The rule's own canonical
          # statement in governance_basics.json never named env reads
          # either -- only "eval, exec, compile, subprocess". Their
          # presence here was a mapping-level over-broadening that had
          # already accumulated an "acceptable" excludes carve-out list
          # (see MINOR ENV READS below, now dead code for this reason and
          # left as historical record rather than pruned) rather than being
          # corrected at the source. No existing rule depends on env reads
          # appearing in *this* forbidden list: data.security.no_raw_secrets
          # governs hardcoded literal secret values (a different concern),
          # and architecture.boundary.settings_access governs importing the
          # Settings object, not raw os.environ access. Removing these two
          # entries leaves both of those enforced exactly as before.
          # Added: bare-import form of subprocess.Popen (distinctive name, low collision risk)
          - "Popen"
          # Added: subprocess family variants
          - "subprocess.check_call"
          - "subprocess.check_output"
          - "subprocess.getoutput"
          - "subprocess.getstatusoutput"
          # Added: os process-spawn family (alternative paths to process creation)
          - "os.execv"
          - "os.execvp"
          - "os.execve"
          - "os.spawnv"
          - "os.spawnvp"
          - "os.fork"
          # Added 2026-07-02: asyncio async-subprocess family -- functionally
          # equivalent to subprocess.Popen but escapes the original forbidden
          # list because the call site uses asyncio.create_subprocess_exec /
          # create_subprocess_shell rather than subprocess.*. Three Will-layer
          # sites caught by this widening; two are sanctioned below, one
          # (proposal_execution_pipeline.py) requires proper delegation to
          # GitService and has no exclude.
          - "asyncio.create_subprocess_exec"
          - "asyncio.create_subprocess_shell"
      scope:
        applies_to:
          - "src/**/*.py"
        excludes:
          # Every entry below must still contain a forbidden call (an entry that
          # exempts nothing is removed) and must say why its call cannot route
          # through src/shared/utils/subprocess_utils.py. 2026-10-07: 21 entries
          # that exempted nothing were removed after the shortcut callers were
          # routed (var/reports/2026-10-06-dangerous-primitives-parallel-system.md).

          # --- THE SANCTIONED SURFACE ---
          - "src/shared/utils/subprocess_utils.py" # the subprocess sanctuary itself
          - "src/shared/infrastructure/git_service.py" # subprocess is the only git interface
          - "src/body/atomic/tool_runner.py" # git/ruff tool invocation (ADR-109 D2)
          # eval/compile here are SAFE: input validated via AST allowlist,
          # builtins disabled, only .intent/ policy conditions evaluated.
          - "src/body/services/policy_expression_evaluator.py"

          # --- PRE-BOOTSTRAP ---
          # Runs before CORE is bound: importing subprocess_utils loads
          # shared.config and the IntentRepository module, which would resolve
          # against the wrong root. One read-only git query, stdlib only; the
          # module holds nothing else (536bed82).
          - "src/cli/pre_bootstrap_git.py"

          - "tests/**"

    governance.intent_meta.required:
      engine: glob_gate
      params:
        check_type: path_match
        patterns:
          - ".intent/META/GLOBAL-DOCUMENT-META-SCHEMA.json"
      scope:
        applies_to:
          - ".intent/META/GLOBAL-DOCUMENT-META-SCHEMA.json"

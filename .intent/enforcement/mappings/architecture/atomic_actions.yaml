mappings:
  atomic_actions.impact_level_must_be_governed:
    engine: regex_gate
    params:
      forbidden_patterns:
        - "impact_level\\s*="
    scope:
      applies_to:
        - "src/body/atomic/**/*.py"
      excludes:
        - "src/body/atomic/registry.py"
        - "src/body/atomic/executor.py"


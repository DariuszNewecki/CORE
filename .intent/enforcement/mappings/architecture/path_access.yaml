mappings:
  architecture.path_access.no_hardcoded_runtime_dirs:
    engine: regex_gate
    params:
      check_type: pattern_match
      patterns:
        - '["'']var/(?:reports|logs|prompts|exports|workflows|build|tmp|mind|run|drafts|context)[/"'']'
        - '/\s*["''](?:reports|logs|prompts|exports|workflows|build|context|mind)["''/]'
      message: >
        Runtime directory name used in path construction expression. Route through
        PathResolver (src/shared/path_resolver.py) or FileHandler instead.
        PathResolver properties: reports_dir, logs_dir, prompts_dir, exports_dir,
        workflows_dir, build_dir, context_dir, knowledge_dir (var/mind/knowledge/).
        Directories without a PathResolver property yet (tmp, run, drafts,
        var/mind/rollbacks) require a PathResolver addition before auto-fix can apply.
        See ADR-031, ADR-032.
    scope:
      applies_to:
        - "src/**/*.py"
      excludes:
        - "src/shared/path_resolver.py"
        - "src/cli/logic/scout.py"
        - "src/mind/coherence/checks/dispatch_parity.py"

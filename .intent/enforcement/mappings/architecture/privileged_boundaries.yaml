mappings:

  architecture.boundary.database_session_access:
    engine: ast_gate
    params:
      check_type: runtime_import_boundary
      forbidden:
        - "shared.infrastructure.database.session_manager.get_session"
        - "sqlalchemy.ext.asyncio.AsyncSession"
    scope:
      applies_to:
        - "src/mind/**/*.py"
        - "src/will/**/*.py"

  architecture.boundary.settings_access:
    engine: ast_gate
    params:
      check_type: runtime_import_boundary
      forbidden:
        - "shared.config.Settings"
        - "shared.config.settings"
    scope:
      applies_to:
        - "src/body/**/*.py"
        - "src/mind/**/*.py"
        - "src/will/**/*.py"
      excludes:
        - "src/body/infrastructure/bootstrap.py"
        - "src/body/infrastructure/*.py"
        - "src/body/infrastructure/**/*.py"

  architecture.boundary.file_handler_access:
    engine: ast_gate
    params:
      check_type: runtime_import_boundary
      forbidden:
        - "shared.infrastructure.storage.file_handler.FileHandler"
    scope:
      applies_to:
        - "src/mind/**/*.py"
        - "src/will/**/*.py"

  architecture.boundary.llm_client_access:
    engine: ast_gate
    params:
      check_type: runtime_import_boundary
      forbidden:
        - "shared.infrastructure.llm.client"
        - "will.agents"
    scope:
      applies_to:
        - "src/body/**/*.py"
        - "src/mind/**/*.py"

  architecture.boundary.embedding_access:
    engine: ast_gate
    params:
      check_type: runtime_import_boundary
      forbidden:
        - "shared.utils.embedding_utils.EmbeddingService"
        - "shared.utils.embedding_utils.build_embedder_from_env"
    scope:
      applies_to:
        - "src/body/**/*.py"
        - "src/mind/**/*.py"
        - "src/will/**/*.py"
        - "src/cli/**/*.py"

  architecture.boundary.remediation_write_access:
    engine: ast_gate
    params:
      check_type: runtime_import_boundary
      forbidden:
        - "shared.infrastructure.git_service.GitService"
    scope:
      applies_to:
        - "src/will/remediation/**/*.py"


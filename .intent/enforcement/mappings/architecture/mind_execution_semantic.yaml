mappings:
  architecture.mind.execution_signal:
    engine: regex_gate
    params:
      forbidden_patterns:
        - "(?m)^\\s+(?:async\\s+)?def\\s+(classify|decide|evaluate|enforce|determine|approve|authorize|deny|allow|validate_operation)\\w*\\s*\\("
        - "\\b(RiskTier|RiskLevel|ApprovalType|ExecutionTier|DecisionTier|AllowList|DenyList)\\b"
        - "(?m)^\\s*(if|elif)\\s+.*\\.(matches|startswith|endswith)\\b.*\\b(execute|run|invoke|allow|deny)\\b"
    scope:
      applies_to:
        - "src/mind/**/*.py"


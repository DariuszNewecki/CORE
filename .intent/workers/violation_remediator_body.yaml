$schema: "META/worker.schema.json"
kind: worker

metadata:
  id: workers.violation_remediator_body
  title: Violation Remediator (Body / CLI)
  version: "1.0.0"
  authority: policy
  status: paused
  rationale: >
    CLI-triggered Body-layer acting worker for per-rule LLM remediation.
    Not daemon-run. Instantiated directly by core-admin workers remediate.
    The daemon discovery path is ViolationExecutorWorker (violation_executor.yaml).

identity:
  uuid: "58351d97-2576-4efb-a9af-8902157ea0aa"
  class: acting

mandate:
  responsibility: >
    For a single declared target_rule, claim open violation findings, build
    architectural context, invoke RemoteCoder, and validate via Crate/Canary
    and assisted.validate_diff, producing an immutable validated candidate.
    A passing candidate automatically creates a human-gated DRAFT proposal
    (ADR-154 D3/D5) — production application happens only after governor
    approval, through ProposalExecutor/SandboxLifecycle, never directly from
    this worker.
  phase: execution
  permitted_tools:
    - llm.remote_coder
    - file.read
    - crate.create
    - canary.validate
  approval_required: true

implementation:
  module: will.workers.violation_remediator_body
  class: ViolationRemediator
  requires_core_context: true

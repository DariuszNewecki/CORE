$schema: "META/worker.schema.json"
kind: worker

metadata:
  id: workers.var_tmp_janitor
  title: var/tmp Janitor
  version: "2.0.0"
  authority: policy
  status: active
  rationale: >
    ADR-117. var/tmp is the repo-internal ephemeral-scratch surface and nothing
    reaped it (974 entries / 17MB observed 2026-06-19; 3.3G by 2026-10-06).
    Phase 1 ran report-only to prove the age/boundary predicate. Phase 2
    (ADR-117 amendment 2026-10-06) deletes stale entries (age > 7 days,
    excluding pinned .keep entries, symlinks never followed) through Body's
    FileService -- the FileHandler chokepoint, var/tmp is ephemeral-scratch --
    capped at max_reap_per_run, matching the canary_janitor precedent
    (ADR-147). Deterministic, no LLM.

identity:
  uuid: "45b47235-9572-4dc8-af7c-d75ef0ef7d8f"
  class: governance

mandate:
  responsibility: >
    Scan var/tmp/, delete stale entries older than the retention threshold
    (excluding pinned .keep entries) up to the per-run cap, and post a
    Blackboard report of what was reaped.
  phase: audit
  permitted_tools: []
  scope:
    domains:
      - governance
  approval_required: false
  schedule:
    max_interval: 21600
    glide_off: 2160

implementation:
  module: will.workers.var_tmp_janitor
  class: VarTmpJanitorWorker
  requires_core_context: false

$schema: "META/worker.schema.json"
kind: worker

metadata:
  id: workers.violation_executor
  title: Violation Executor
  version: "1.0.0"
  authority: policy
  status: active

identity:
  uuid: "c9d4e5f6-a7b8-4c0d-9e1f-2a3b4c5d6e7f"
  class: acting

mandate:
  responsibility: >
    For each open audit violation finding, build a deterministic architectural
    context package for the violating file, invoke RemoteCoder to produce a
    fix, and validate it via Crate/Canary and assisted.validate_diff into an
    immutable candidate that automatically creates a human-gated PENDING
    proposal (ADR-154 D3/D5). File-mode injects findings from a single-file
    audit for candidate-export-only inspection (ADR-154 D3a).
  phase: execution
  permitted_tools:
    - llm.remote_coder
    - file.read
    - crate.create
    - canary.validate
  scope:
    paths:
      - "src/**"
    domains:
      - compliance
      - remediation
  approval_required: true
  schedule:
    max_interval: 600
    files_per_cycle_max: 10

implementation:
  module: will.workers.violation_executor
  class: ViolationExecutorWorker
  requires_core_context: true
  requires_dedicated_process: true

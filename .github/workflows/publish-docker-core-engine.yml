# .github/workflows/publish-docker-core-engine.yml
#
# F-48.3 (#539) — publish the `core-engine` Solo+ runtime image to GHCR.
#
# Per ADR-086 D7, a `core-engine:X.Y.Z` image must exist if and only if
# `core-runtime X.Y.Z` exists on PyPI. The image installs the *published*
# wheel (ADR-086 D1), so it can only be built AFTER the PyPI publish for the
# same tag — enforced by the "wait for PyPI" guard below.
#
# Triggers:
#   - publish-pypi.yml, after it published the tag (workflow_call)
#   - manual workflow_dispatch with a version input (to backfill an already
#     published release, e.g. 2.7.0)
#
# One-time manual step after the first publish: set the GHCR package
# visibility to Public (Packages → core-engine → Settings) so customers can
# pull without authenticating. The GITHUB_TOKEN cannot flip that flag.

name: Publish core-engine (Docker)

on:
  # Called by publish-pypi.yml after the PyPI publish of a v*.*.* tag
  # succeeded, not on the tag push itself: the publish waits for green CI (a
  # full run included), which outlasted the PyPI wait below for v2.14.3
  # (2026-10-15, both images failed). A reusable call keeps the trusted
  # tag-push context (no workflow_run).
  workflow_call:
    inputs:
      version:
        description: "core-runtime version just published, e.g. 2.14.4"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)publish, e.g. 2.7.0 — must already be on PyPI"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and publish core-engine to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version (call or dispatch input)
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # inputs.version: dispatch (backfill) and workflow_call alike;
          # "v2.14.4" or "2.14.4". Through the environment, and checked.
          V="${INPUT_VERSION#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$INPUT_VERSION' is not X.Y.Z"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Wait for core-runtime==${{ steps.ver.outputs.version }} on PyPI (iff ordering)
        run: |
          V="${{ steps.ver.outputs.version }}"
          # #960: ask pip itself, which is what the image build runs. The JSON
          # API can list a release before pip's index (CDN) does; on v2.12.1
          # core-engine passed this wait on the JSON API and then failed
          # `pip install` seconds later. --python-version 3.12 matches the
          # images' base, so the runner's own Python cannot cause a miss.
          for i in $(seq 1 30); do
            if python3 -m pip download --quiet --no-deps --no-cache-dir \
                 --python-version 3.12 --dest "$RUNNER_TEMP/pypi-wait" \
                 "core-runtime==${V}" >/dev/null 2>&1; then
              echo "core-runtime==${V} resolves with pip — proceeding."
              exit 0
            fi
            echo "[$i/30] pip cannot resolve core-runtime==${V} yet; waiting 20s..."
            sleep 20
          done
          echo "::error::core-runtime==${V} never appeared on PyPI — refusing to build core-engine (ADR-086 D7 iff invariant)."
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push core-engine
        uses: docker/build-push-action@v7
        with:
          context: .docker/core-engine
          file: .docker/core-engine/Dockerfile
          build-args: |
            CORE_RUNTIME_VERSION=${{ steps.ver.outputs.version }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/dariusznewecki/core-engine:${{ steps.ver.outputs.version }}
            ghcr.io/dariusznewecki/core-engine:latest

      - name: Summary
        run: |
          echo "### Published \`ghcr.io/dariusznewecki/core-engine:${{ steps.ver.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "(+ \`:latest\`) — ADR-086 D7 iff satisfied for this release." >> "$GITHUB_STEP_SUMMARY"

# .github/workflows/ci.yml
name: CI (Smoke)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Commit SHA to check out and test. Optional — omit to test the
          ref used to trigger this dispatch. Lets hosted CI run against an
          arbitrary commit (e.g. on a branch that never targets main)
          without a throwaway PR (#827).
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          # Poetry >= 2.0 required: pyproject.toml uses the PEP 621 [project]
          # table, which Poetry 1.x cannot read (poetry install would fail on
          # the now-metadata-less [tool.poetry] section).
          version: "2.2.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run tests (smoke)
        run: poetry run pytest -q

# .github/workflows/pr-first-line.yml
# The "Host change:" first-line rule is retired (ceremony cut #1255, governor
# 2026-10-23): the promotion summary lists host changes first and the governor
# approves there. The job stays only because ruleset main-checks requires a
# check named host-change-stated; it passes. Delete this file once the ruleset
# no longer lists it.
name: PR first line

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  host-change-stated:
    runs-on: ubuntu-latest
    steps:
      - run: "echo retired by issue 1255, the promotion lists host changes"

# .github/workflows/publish-docker-audit-gate.yml
#
# F-10.3 / #578 — Publish the `core-audit-gate` image to GHCR.
#
# Builds from `Dockerfile` (repo root) and pushes to
# ghcr.io/dariusznewecki/core-audit-gate after each successful PyPI publish of a semver tag, and on
# manual dispatch. The image pins `core-runtime` via the ARG declared
# in the Dockerfile; the tag here must match the PyPI release.
#
# Once this workflow has published at least one image, update action.yml:
#   runs.image: 'docker://ghcr.io/dariusznewecki/core-audit-gate:vX.Y.Z'
# to skip the per-invocation build (~30s saved per CI run).
#
# Package visibility: after the first push, set the GHCR package to
# Public (Packages → core-audit-gate → Settings) so cold reviewers can
# docker pull without authenticating.

name: Publish core-audit-gate (Docker)

on:
  # After the PyPI publish of a tag succeeds, not on the tag push itself: the
  # publish waits for green CI (a full run included), which can take longer
  # than the PyPI wait below. On 2026-10-15 both images failed for v2.14.3
  # because PyPI published ~40 minutes after the tag. A rerun of the publish
  # triggers this again.
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "core-runtime version to pin, e.g. 2.8.0 — must already be on PyPI"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and publish core-audit-gate to GHCR
    # Only a successful publish of a v*.*.* tag (or a manual backfill).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The tagged commit, not the default branch workflow_run runs on.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve version (tag or dispatch input)
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            # workflow_run: head_branch is the tag the PyPI publish ran for.
            TAG="${{ github.event.workflow_run.head_branch }}"
            V="${TAG#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Wait for core-runtime==${{ steps.ver.outputs.version }} on PyPI
        run: |
          V="${{ steps.ver.outputs.version }}"
          # #960: ask pip itself, which is what the image build runs. The JSON
          # API can list a release before pip's index (CDN) does; on v2.12.1
          # core-engine passed this wait on the JSON API and then failed
          # `pip install` seconds later. --python-version 3.12 matches the
          # images' base, so the runner's own Python cannot cause a miss.
          for i in $(seq 1 30); do
            if python3 -m pip download --quiet --no-deps --no-cache-dir \
                 --python-version 3.12 --dest "$RUNNER_TEMP/pypi-wait" \
                 "core-runtime==${V}" >/dev/null 2>&1; then
              echo "core-runtime==${V} resolves with pip — proceeding."
              exit 0
            fi
            echo "[$i/30] pip cannot resolve core-runtime==${V} yet; waiting 20s..."
            sleep 20
          done
          echo "::error::core-runtime==${V} never appeared on PyPI — refusing to build core-audit-gate."
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push core-audit-gate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: |
            CORE_RUNTIME_VERSION=${{ steps.ver.outputs.version }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/dariusznewecki/core-audit-gate:${{ steps.ver.outputs.version }}
            ghcr.io/dariusznewecki/core-audit-gate:latest

      - name: Summary
        run: |
          echo "### Published \`ghcr.io/dariusznewecki/core-audit-gate:${{ steps.ver.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "+ \`:latest\` — cold reviewers can now \`docker run --rm -v \"\$PWD:/workspace\" ghcr.io/dariusznewecki/core-audit-gate:${{ steps.ver.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

# .github/workflows/core-ci.yml
name: CORE CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Commit SHA to check out and test. Optional — omit to test the
          ref used to trigger this dispatch. Lets hosted CI run against an
          arbitrary commit (e.g. on a branch that never targets main or
          develop) without a throwaway PR (#827).
        required: false

# ADR-157 D2: cancel a superseded push/PR run when a newer commit lands on the
# same ref -- rapid-fire pushes (e.g. #842's fix-up series) otherwise let each
# run's full ~25min ephemeral-DB job complete after its result is already
# moot. workflow_dispatch runs get a unique group per invocation (github.run_id)
# so an intentional dispatch against an old SHA (#827) is never auto-cancelled
# by an unrelated later push.
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # #631 — fail when README's advertised governance counts drift from source.
  # Pure shell + jq (pre-installed on the runner); no Poetry/DB, runs in parallel.
  readme-counts:
    name: README count drift (#631)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: Re-derive README quantitative claims from source
        run: bash scripts/check_readme_counts.sh

  # #726 — advisory check: multi-phase ADRs with open phases must have a
  # linked issue so they don't quietly stall. continue-on-error: true keeps
  # this advisory (visible in workflow run, never blocks merge).
  adr-phases:
    name: ADR phase tracking (#726)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pyyaml
        run: pip install pyyaml --quiet
      - name: Check for untracked open ADR phases
        run: python scripts/check_adr_phases.py --specs-dir .specs/decisions

  # Production-readiness chain: URS definition -> attestation manifest ->
  # generated README status. Blocking — a manifest that over-claims (a `met`
  # gate without dated human evidence) or a README out of sync with the
  # manifest must never reach main. Pure Python + pyyaml; no DB.
  production-readiness:
    name: Production-readiness manifest ↔ README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pyyaml
        run: pip install pyyaml --quiet
      - name: Validate manifest invariants + README sync
        run: python scripts/production_readiness.py

  # ADR-157 D3.1: extracted from `validate` -- none of these four checks need
  # the database (vocabulary sync is file-based; audit runs --offline; ruff
  # and pip-audit are static/dependency-only), so they no longer wait on
  # container startup or share a timeout budget with the test run.
  static-checks:
    name: Static checks (vocabulary, audit, lint, deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry & Pip
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-3.12-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-3.12-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Vocabulary freshness check
        run: poetry run core-admin intent sync vocabulary --check

      # Constitutional audit, per push, blocking rules only. See ADR-115's
      # note on --offline: without it the CLI routes through CoreApiClient to
      # a core-api daemon that does not exist on a runner.
      - name: Constitutional audit (blocking rules, stateless engine)
        timeout-minutes: 10
        run: poetry run core-admin code audit --offline --severity=block

      # ADR-115 D3: lint statically (ruff), not via the core-api server.
      - name: Lint (ruff — static, no server)
        run: poetry run ruff check src tests

      - name: Upgrade pip in Poetry venv
        run: poetry run pip install --upgrade "pip>=26.1.2"

      - name: Dependency audit (pip-audit)
        run: poetry run pip-audit

  # ADR-157 D3.4: mathematically, `-m "not integration"` and `-m "integration"`
  # are complementary and exhaustive over a fixed collection by construction —
  # this job exists to catch drift the math doesn't cover (a file silently
  # failing to collect in one job's environment, a typo'd marker name past
  # --strict-markers, a future -k filter layered on top of -m). No DB, no
  # test execution, just three `--collect-only` passes and a set comparison.
  test-partition-ratchet:
    name: Verify unit/integration partition (ADR-157 D3.4)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry & Pip
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-3.12-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-3.12-
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Verify unit/integration node-ID sets are disjoint and exhaustive
        run: python scripts/verify_test_partition.py

  # ADR-157 D3.4: no service containers -- CORE_UNIT_JOB=1 turns any DB
  # session attempt into a hard failure (tests/conftest.py) rather than the
  # silent, honest-for-local-dev skip a forgotten `integration` marker would
  # otherwise produce. Named "hermetic", not "unit": it also builds and
  # exercises the published wheel (tests/cli/test_offline_audit_regression_544.py,
  # e2e+slow but DB-free), which the old single job always skipped because
  # `poetry build` never ran and dist/ is gitignored.
  hermetic:
    name: Hermetic tests (unit + wheel e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Cache Poetry & Pip
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-3.12-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-3.12-
      - name: Install dependencies
        run: poetry install --no-interaction
      # test_offline_audit_regression_544.py looks for dist/core_runtime-*.whl
      # and skips if absent -- build it before pytest runs, not after, so the
      # test's own logic (not a workaround) picks it up.
      - name: Build wheel
        run: poetry build
      # addopts (pyproject.toml) already supplies --cov=src and the
      # html/term-missing report types; --cov-report= does NOT clear an
      # already-accumulated report list (verified empirically -- it's
      # additive, "multi-allowed" per pytest-cov's own --help), so there is
      # nothing to override here beyond routing the raw data file via
      # COVERAGE_FILE.
      - name: Run hermetic tests (xdist, no DB)
        env:
          CORE_UNIT_JOB: "1"
          COVERAGE_FILE: .coverage.hermetic
        run: poetry run pytest -m "not integration" -n auto
      - name: Upload hermetic coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-hermetic-data
          path: .coverage.hermetic
          include-hidden-files: true

  # ADR-115: runs against ephemeral, hermetic infrastructure provisioned per
  # run and seeded from the canonical schema -- no dependency on a
  # hand-maintained LAN host. Serial (no xdist) on initial landing per
  # ADR-157 D3.6 -- per-worker DB isolation is real engineering risk, not
  # justified until D3.8 shows the plain split alone isn't fast enough.
  integration:
    name: Integration tests (DB)
    runs-on: ubuntu-latest
    # Hard bound: the integration suite must never hang the runner. If a test
    # blocks on an unprovisioned dependency, fail the job rather than wait.
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: core_test_db
          POSTGRES_PASSWORD: core_test_db
          POSTGRES_DB: core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Cache Poetry & Pip
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-3.12-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-3.12-

      - name: Install dependencies
        run: poetry install --no-interaction

      # ADR-115 D1: point the test config at the ephemeral localhost services.
      # The committed .env.test targets the LAN dev DB; rewrite only the runner's
      # copy. shared.config loads .env.test with override=True under pytest, so a
      # job-level env var would not win — the file itself must be rewritten.
      - name: Point test config at ephemeral services
        run: |
          sed -i \
            -e 's#@192\.168\.20\.23:5432#@localhost:5432#' \
            -e 's#http://192\.168\.20\.22:6333#http://localhost:6333#' \
            .env.test

      # ADR-115 D1: seed the ephemeral DB from the canonical schema-as-truth.
      # schema.sql is portable (--no-owner --no-acl); roles and extensions are
      # still prerequisite because the CHECK constraints and index types need them.
      - name: Seed database from canonical schema
        env:
          PGPASSWORD: core_test_db
        run: |
          psql -h localhost -U core_test_db -d core_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE core_db;" \
            -c "CREATE ROLE core;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" \
            -c "CREATE EXTENSION IF NOT EXISTS btree_gin;" \
            -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"
          psql -h localhost -U core_test_db -d core_test -v ON_ERROR_STOP=1 \
            < schema.sql

      # #773 T5.1: this job provisions a real ephemeral Postgres above
      # (services: postgres) -- DB reachability here is a guaranteed
      # precondition, not best-effort. If it's ever unreachable, that's an
      # infrastructure fault that must fail the run outright rather than
      # silently skip the entire DB-backed test population.
      # No --cov-fail-under here: this job's coverage is necessarily partial
      # (integration-marked tests only) -- the combined-suite gate lives on
      # coverage-combine (ADR-157 D3.7), reading the union of both jobs.
      - name: Run integration tests with coverage
        env:
          CORE_REQUIRE_DB_TESTS: "1"
          COVERAGE_FILE: .coverage.integration
        run: poetry run pytest -m integration

      - name: Upload integration coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration-data
          path: .coverage.integration
          include-hidden-files: true

  # ADR-157 D3.7: the two test jobs run on separate, ephemeral runners with no
  # shared filesystem -- this job is the explicit transfer-and-combine step,
  # not an afterthought. Both jobs check out the same commit SHA on the same
  # runner image, so absolute paths match without needing
  # [tool.coverage.paths] remapping; if that assumption ever breaks, `coverage
  # combine` fails loudly with a "couldn't combine" error, not a silently
  # wrong number.
  coverage-combine:
    name: Coverage (combined, ≥38% enforced)
    runs-on: ubuntu-latest
    needs: [hermetic, integration]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Only `coverage` itself is needed here, not the whole project's
      # dependency set -- this job runs no project code, just combines data
      # files produced elsewhere.
      - name: Install coverage
        run: pip install coverage --quiet
      - name: Download hermetic coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-hermetic-data
      - name: Download integration coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration-data
      - name: Combine coverage from both jobs
        run: coverage combine .coverage.hermetic .coverage.integration
      - name: Coverage report (combined suite, enforced)
        run: coverage report --fail-under=38
      - name: Coverage XML (combined, for Codecov)
        run: coverage xml -o coverage.xml
      - name: Upload coverage to Codecov
        if: github.repository == 'DariuszNewecki/CORE'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          name: core-ci-combined
          fail_ci_if_error: true
          verbose: true

  pr_linter:
    name: PR Linter
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check PR Body for Intent & Justification
        id: check_body
        # PR body is passed via env, never interpolated inline into the script:
        # an inline ${{ ... }} breaks on quotes/backticks/HTML in the body and is a
        # shell script-injection vector.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -q "> REQUIRED:"; then
            echo "missing_justification=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing_justification=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post Nudge Comment
        if: steps.check_body.outputs.missing_justification == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `
            #### 📝 Intent Required
            Thank you for the contribution!

            Please update the pull request description to include the **Intent & Justification** for this change. This is a constitutional requirement to ensure every change is traceable to a purpose.
            `;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: output
            });

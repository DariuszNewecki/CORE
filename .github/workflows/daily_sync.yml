# .github/workflows/daily_sync.yml
# This workflow runs the daily constitutional audit for CORE.

name: "Daily Constitutional Audit"

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

# ADR-157 D2: cancel a superseded run if a manual dispatch overlaps the
# scheduled cron; a workflow_dispatch run still gets its own unique group.
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: "Constitutional Audit"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v7

      - name: "Install Poetry"
        uses: snok/install-poetry@v1
        with:
          # Must be installed BEFORE setup-python so its `cache: 'poetry'`
          # can locate Poetry; >= 2.0 for the PEP 621 [project] table.
          version: "2.2.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'poetry'

      - name: "Install Dependencies"
        run: poetry install

      # #907: machine-readable run gated on the JSON verdict (PASS or
      # DEGRADED continue; DEGRADED is warned + summarised, never PASS;
      # FAIL/ERROR/unknown/malformed fail closed). Same gate as core-ci.yml.
      - name: "Run Constitutional Audit"
        run: |
          set +e
          RESULT="$RUNNER_TEMP/offline-audit-result.json"
          poetry run core-admin code audit --offline --severity=block --format=json > "$RESULT"
          RAW_EXIT=$?
          echo "raw exit=$RAW_EXIT; result=$RESULT"
          set -e
          python3 - "$RESULT" "$RAW_EXIT" <<'PY'
          # #907 CI policy: gate on the governed verdict in the JSON result, never on
          # the exit code alone. Continue only for the canonical verdicts PASS and
          # DEGRADED; fail closed on FAIL, ERROR, a crashed command, malformed or
          # missing JSON, a missing/unknown verdict, or any BLOCK-severity finding.
          # DEGRADED is explicit: a ::warning plus the skipped blocking rule IDs in
          # the job summary. It is never relabelled PASS.
          import json
          import os
          import sys

          result_path, raw_exit = sys.argv[1], int(sys.argv[2])
          ACCEPTED = {"PASS", "DEGRADED"}
          BLOCK_SEVERITIES = {"block", "blocking"}


          def summary(text: str) -> None:
              path = os.environ.get("GITHUB_STEP_SUMMARY")
              if path:
                  with open(path, "a", encoding="utf-8") as fh:
                      fh.write(text + "\n")
              print(text)


          def fail(msg: str) -> None:
              print(f"::error title=CORE offline audit gate::{msg}")
              summary(f"## CORE offline audit: FAILED CLOSED\n\n{msg} (raw exit {raw_exit})")
              sys.exit(1)


          try:
              with open(result_path, encoding="utf-8") as fh:
                  result = json.load(fh)
          except Exception as exc:  # noqa: BLE001 - any parse/IO failure fails closed
              fail(f"audit result missing or not JSON: {exc}")
          if not isinstance(result, dict):
              fail("audit result is not a JSON object")

          verdict = result.get("verdict")
          if verdict not in ACCEPTED:
              fail(f"verdict={verdict!r} is not an accepted stateless verdict {sorted(ACCEPTED)}")

          findings = result.get("findings") or []
          blocking = [f for f in findings if str(f.get("severity", "")).lower() in BLOCK_SEVERITIES]
          for f in blocking:
              print(
                  f"::error title={f.get('check_id') or f.get('rule_id')}::"
                  f"{f.get('file_path') or f.get('file')}:{f.get('line_number') or f.get('line')} "
                  f"{f.get('message')}"
              )
          if blocking:
              fail(f"{len(blocking)} BLOCK-severity finding(s) present (verdict {verdict})")

          if verdict == "PASS" and raw_exit != 0:
              fail(f"verdict PASS but command exited {raw_exit}")
          if verdict == "DEGRADED" and raw_exit not in (0, 1):
              fail(f"verdict DEGRADED but command exited {raw_exit}")

          stats = result.get("stats") or {}
          skipped = result.get("skipped_rules") or []
          skipped_blocking = [s for s in skipped if s.get("enforcement") == "blocking"]
          if verdict == "DEGRADED":
              ids = ", ".join(s.get("rule_id", "?") for s in skipped_blocking) or "(none listed)"
              print(
                  f"::warning title=CORE offline audit DEGRADED::{len(skipped_blocking)} blocking "
                  f"rule(s) NOT evaluated in stateless mode (accepted, not PASS): {ids}"
              )
              lines = [
                  "## CORE offline audit: DEGRADED (accepted for the stateless step; not PASS)",
                  "",
                  f"Executed {stats.get('runnable_rules', '?')} rule(s); {len(skipped)} skipped, "
                  f"{len(skipped_blocking)} of them blocking. Raw exit {raw_exit}.",
                  "",
                  "Blocking rules not evaluated:",
              ]
              lines += [
                  f"- `{s.get('rule_id')}` ({s.get('engine')}): {s.get('reason')}" for s in skipped_blocking
              ]
              summary("\n".join(lines))
          else:
              summary(
                  f"## CORE offline audit: PASS\n\nExecuted {stats.get('runnable_rules', '?')} rule(s); "
                  f"{len(skipped)} skipped (0 blocking). Raw exit {raw_exit}."
              )
          PY

      - name: "Preserve offline audit result (complete JSON)"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-audit-result
          path: ${{ runner.temp }}/offline-audit-result.json
          if-no-files-found: warn

      - name: "Dump raw mypy output (on audit failure)"
        if: failure()
        continue-on-error: true
        run: |
          poetry run mypy src/
